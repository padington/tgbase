name: bootstrap libinsta-dl runner

on:
  workflow_dispatch:
  push:
    branches: [probe/ig-net]
    paths: [.github/workflows/bootstrap-dl-runner.yml]

jobs:
  runner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Start containerized runner for padington/libinsta-dl
        env:
          RUNNER_TOKEN: ${{ secrets.DL_RUNNER_TOKEN }}
        run: |
          WORK=$HOME/dl-runner
          mkdir -p "$WORK"
          docker ps -a --filter name=dl-runner --format '{{.Names}} {{.Status}}' || true
          docker logs --tail 20 dl-runner 2>&1 | tail -20 || true
          docker stop dl-runner 2>/dev/null || true
          docker rm dl-runner 2>/dev/null || true
          docker volume rm dl-runner-config >/dev/null 2>&1 || true
          docker volume create dl-runner-config >/dev/null 2>&1 || true
          docker run -d --name dl-runner --restart unless-stopped \
            -e REPO_URL=https://github.com/padington/libinsta-dl \
            -e RUNNER_NAME=vps-debian12-dl \
            -e RUNNER_TOKEN \
            -e RUNNER_WORKDIR="$WORK" \
            -e LABELS=self-hosted,Linux,X64,libinsta-dl \
            -e DISABLE_AUTO_UPDATE=true \
            -e CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-config \
            -e DISABLE_AUTOMATIC_DEREGISTRATION=true \
            -v dl-runner-config:/runner-config \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$WORK":"$WORK" \
            myoung34/github-runner:latest
          sleep 25; docker logs --tail 15 dl-runner
