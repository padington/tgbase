name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - '!**/*_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'config.yaml'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: docker run --rm -v "$PWD":/app -w /app golang:1.23-alpine go test ./...

      - name: Build image
        run: docker build -t tgbase .

      - name: Restart container
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          docker volume create tgbase_data 2>/dev/null || true
          docker stop tgbot 2>/dev/null || true
          docker rm tgbot 2>/dev/null || true
          docker run -d \
            --name tgbot \
            --restart unless-stopped \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e BOT_ENV=vps \
            -e DATA_PATH=/data/state.json \
            -v tgbase_data:/data \
            tgbase
