name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            -v go-mod-cache:/go/pkg/mod \
            -v go-build-cache:/root/.cache/go-build \
            golang:1.23-alpine go test ./...

      - name: Build image
        run: docker build -t tgbase .

      - name: Restart container
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          docker volume create tgbase_data 2>/dev/null || true
          docker stop tgbot 2>/dev/null || true
          docker rm tgbot 2>/dev/null || true
          docker run -d \
            --name tgbot \
            --restart unless-stopped \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e BOT_ENV=vps \
            -e DATA_DIR=/data \
            -v tgbase_data:/data \
            tgbase
