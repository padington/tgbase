name: diag VPS
on:
  workflow_dispatch:
  push:
    branches: [probe/ig-net]
    paths: [.github/workflows/diag-vps.yml]
jobs:
  diag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - run: |
          uptime; free -m; df -h / | tail -1
          echo "== containers"; docker ps -a --format '{{.Names}}	{{.Status}}	{{.Image}}'
          echo "== dl-runner first 40 lines"; docker logs dl-runner 2>&1 | head -40
          echo "== dl-runner around first failure"; docker logs dl-runner 2>&1 | grep -n -i -E "Running job|Job .* completed|exit|error|terminat|shut|update|Listening|removed|deleted|Failed" | head -40
          echo "== inspect"; docker inspect dl-runner --format 'restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}'
          echo "== events die"; docker events --since 4h --until 1s --filter container=dl-runner --filter event=die 2>/dev/null | head -5 || true
