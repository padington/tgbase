name: diag VPS
on:
  workflow_dispatch:
  push:
    branches: [probe/ig-net]
    paths: [.github/workflows/diag-vps.yml]
jobs:
  diag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - run: |
          uptime; free -m; df -h / | tail -1
          echo "== containers"; docker ps -a --format '{{.Names}}	{{.Status}}	{{.Image}}'
          echo "== dl-runner logs"; docker logs --tail 60 dl-runner 2>&1 | tail -60 || true
          echo "== libinsta-dl logs"; docker logs --tail 20 libinsta-dl 2>&1 | tail -20 || true
          echo "== dmesg oom"; (dmesg 2>/dev/null | grep -i -E "oom|killed process" | tail -10) || true
          echo "== docker events"; docker events --since 3h --until 1s --filter container=dl-runner 2>/dev/null | tail -20 || true
