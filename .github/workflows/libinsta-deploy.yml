name: libinsta deploy (VPS)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch of padington/catalog-ea269e956d1b to deploy
        required: false
        default: vps-download
      action:
        description: "deploy | logs (only print docker logs, no restart) | index (refresh /data/index.json from padington/libinsta-index, no restart)"
        required: false
        default: deploy
      tail:
        description: lines of docker logs for action=logs
        required: false
        default: "200"
  # push trigger exists only so GitHub registers this dispatch-only workflow outside the
  # default branch (otherwise `gh workflow run` answers 404); push runs are skipped below.
  push:
    branches: [probe/ig-net]
    paths: [.github/workflows/libinsta-deploy.yml]

jobs:
  logs:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'
    runs-on: self-hosted
    steps:
      - name: docker logs
        run: |
          docker ps -a --filter name=libinsta --format '{{.Names}} {{.Status}} restarts={{.RunningFor}}'
          docker inspect -f 'running={{.State.Running}} restarts={{.RestartCount}} started={{.State.StartedAt}}' libinsta
          docker logs --tail "${{ github.event.inputs.tail || '200' }}" libinsta 2>&1
  index:
    # Search index for /tags /find (SPEC 3.5). Read-only deploy key of padington/libinsta-index
    # (secret LIBINSTA_INDEX_DEPLOY_KEY); the bot sees the new file by mtime and reloads it.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'index'
    runs-on: self-hosted
    steps:
      - name: Fetch index (read-only deploy key)
        env:
          KEY: ${{ secrets.LIBINSTA_INDEX_DEPLOY_KEY }}
        run: |
          # own ssh setup: the VPS /etc/ssh/ssh_config has server-only options and breaks actions/checkout
          rm -rf libinsta-index; d="$(mktemp -d)"; umask 077
          printf '%s\n' "$KEY" > "$d/key"
          ssh_cmd="ssh -F /dev/null -i $d/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$d/kh -o BatchMode=yes"
          GIT_SSH_COMMAND="$ssh_cmd" git clone -q --depth 1 git@github.com:padington/libinsta-index.git libinsta-index \
            || GIT_SSH_COMMAND="$ssh_cmd -p 443" git clone -q --depth 1 ssh://git@ssh.github.com:443/padington/libinsta-index.git libinsta-index
          rc=$?; rm -rf "$d"; test $rc = 0
          python3 -c "import json;d=json.load(open('libinsta-index/index.json'));print('index.json: %d posts, built_at %s' % (len(d['posts']), d.get('built_at')))"
      - name: Copy index.json into the running container
        run: |
          docker cp libinsta-index/index.json libinsta:/data/index.json.new
          docker exec libinsta sh -c 'mv /data/index.json.new /data/index.json'
          sleep 8
          docker logs --since 30s libinsta 2>&1 | grep -i index || true
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'logs' && github.event.inputs.action != 'index'
    runs-on: self-hosted
    steps:
      - name: Remove root-owned leftovers (docker runs as root on the workspace bind mount)
        run: |
          [ -d catalog ] && docker run --rm -v "$PWD/catalog":/w python:3.11-slim sh -c 'find /w -name __pycache__ -prune -exec rm -rf {} +' || true
      - name: Checkout catalog code
        uses: actions/checkout@v4
        with:
          repository: padington/catalog-ea269e956d1b
          ref: ${{ github.event.inputs.ref || 'vps-download' }}
          path: catalog
      - name: Build image
        run: docker build -f Dockerfile.vps -t libinsta .
        working-directory: catalog
      - name: Fetch search index (optional; bot works without it)
        continue-on-error: true
        env:
          KEY: ${{ secrets.LIBINSTA_INDEX_DEPLOY_KEY }}
        run: |
          # own ssh setup: the VPS /etc/ssh/ssh_config has server-only options and breaks actions/checkout
          rm -rf libinsta-index; d="$(mktemp -d)"; umask 077
          printf '%s\n' "$KEY" > "$d/key"
          ssh_cmd="ssh -F /dev/null -i $d/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$d/kh -o BatchMode=yes"
          GIT_SSH_COMMAND="$ssh_cmd" git clone -q --depth 1 git@github.com:padington/libinsta-index.git libinsta-index \
            || GIT_SSH_COMMAND="$ssh_cmd -p 443" git clone -q --depth 1 ssh://git@ssh.github.com:443/padington/libinsta-index.git libinsta-index
          rc=$?; rm -rf "$d"; test $rc = 0
          python3 -c "import json;d=json.load(open('libinsta-index/index.json'));print('index.json: %d posts, built_at %s' % (len(d['posts']), d.get('built_at')))"
      - name: Restart service
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.LIBINSTA_BOT_TOKEN }}
          GH_INDEX_TOKEN: ${{ secrets.GH_INDEX_TOKEN }}   # optional fine-grained PAT; empty -> file mode
        run: |
          docker volume create libinsta_data >/dev/null 2>&1 || true
          if [ -f libinsta-index/index.json ]; then
            docker run --rm -v libinsta_data:/data -v "$PWD/libinsta-index":/src:ro python:3.11-slim \
              sh -c 'cp /src/index.json /data/index.json.new && mv /data/index.json.new /data/index.json && ls -l /data/index.json'
          else
            echo "no index.json checked out — keeping the one in the volume (if any)"
          fi
          docker stop libinsta 2>/dev/null || true
          docker rm libinsta 2>/dev/null || true
          docker run -d --name libinsta --restart unless-stopped \
            --log-opt max-size=10m --log-opt max-file=3 \
            -e IG_SESSION_JSON -e TELEGRAM_BOT_TOKEN -e GH_INDEX_TOKEN \
            -e TG_CHAT_ID="-1004300487255" -e OWNER_IDS="${{ vars.LIBINSTA_OWNER_IDS }}" \
            -e DATA_DIR=/data -v libinsta_data:/data libinsta
          sleep 20
          docker ps --filter name=libinsta --format '{{.Names}} {{.Status}}'
          docker logs --tail 30 libinsta
          test "$(docker inspect -f '{{.State.Running}}' libinsta)" = true
          docker image prune -f >/dev/null 2>&1 || true
