name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE'
      - '.env.example'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            -v go-mod-cache:/go/pkg/mod \
            -v go-build-cache:/root/.cache/go-build \
            golang:1.23-alpine go test ./...
