# Bundled into the Docker image at /products.yaml. On first boot the
# Catalog seeds itself from this file. After that the backend (under
# DATA_DIR) is the source of truth and this file is only a fresh-install
# fallback.
#
# Categories declare the buckets the picker browses by (id, emoji,
# localized names). Products reference a category by id; per-product
# emoji is optional and falls back to the category emoji at render time.
# Stage values (low / medium / high) are starting estimates loosely
# anchored to Monash low-FODMAP serving sizes — adjust per user via
# the runtime catalog API rather than editing this seed.

categories:
  - id: fruits
    emoji: "🍎"
    name_localized: { en: Fruits, ru: Фрукты }
  - id: vegetables
    emoji: "🥬"
    name_localized: { en: Vegetables, ru: Овощи }
  - id: dairy
    emoji: "🥛"
    name_localized: { en: Dairy, ru: Молочное }
  - id: grains
    emoji: "🌾"
    name_localized: { en: Grains & bread, ru: Злаки и хлеб }
  - id: legumes
    emoji: "🥜"
    name_localized: { en: Legumes & nuts, ru: Бобовые и орехи }
  - id: sweets
    emoji: "🍯"
    name_localized: { en: Sweets & sauces, ru: Сладкое и соусы }

products:
  # Fruits -------------------------------------------------------------
  - name: Apple
    category: fruits
    emoji: "🍎"
    fodmap: high
    measure: pieces
    stages: { low: 0.25, medium: 0.5, high: 1.0 }
    note: Test on empty stomach; monitor 2h
    name_localized: { ru: "Яблоко" }
    note_localized: { ru: "Тестировать натощак, наблюдать 2 ч" }

  - name: Apricot
    category: fruits
    emoji: "🍑"
    fodmap: high
    measure: pieces
    stages: { low: 0.5, medium: 1, high: 2 }
    name_localized: { ru: "Абрикос" }

  - name: Blackberry
    category: fruits
    emoji: "🫐"
    fodmap: high
    measure: grams
    stages: { low: 20, medium: 40, high: 80 }
    name_localized: { ru: "Ежевика" }

  - name: Cherry
    category: fruits
    emoji: "🍒"
    fodmap: high
    measure: pieces
