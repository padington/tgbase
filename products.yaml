# Bundled into the Docker image at /products.yaml. On first boot the
# Catalog seeds itself from this file. After that the backend (under
# DATA_DIR) is the source of truth and this file is only a fresh-install
# fallback.
- name: Apple
  fodmap: high
  measure: pieces
  stages: { low: 0.25, medium: 0.5, high: 1.0 }
  note: Test on empty stomach; monitor 2h
  name_localized:
    ru: "Яблоко"
  note_localized:
    ru: "Тестировать натощак, наблюдать 2 ч"

- name: Cashews
  fodmap: high
  measure: grams
  stages: { low: 10, medium: 20, high: 30 }
  name_localized:
    ru: "Кешью"

- name: Milk (cow)
  fodmap: high
  measure: ml
  stages: { low: 50, medium: 100, high: 200 }
  name_localized:
    ru: "Молоко коровье"

- name: Honey
  fodmap: high
  measure: spoons
  stages: { low: 0.5, medium: 1, high: 2 }
  name_localized:
    ru: "Мёд"

- name: Garlic
  fodmap: high
