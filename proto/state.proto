syntax = "proto3";

package tgbase.state.v1;

import "google/protobuf/timestamp.proto";
import "products.proto";

option go_package = "github.com/padington/tgbase/internal/state/pb;pb";

enum StateKind {
  STATE_UNSPECIFIED = 0;
  STATE_IDLE = 1;
  STATE_AWAITING_DEFECATION = 2;
  STATE_AWAITING_PRODUCT_CHOICE = 3;
  STATE_AWAITING_STAGE_CHECKIN = 4;
  STATE_AWAITING_STAGE_CHOICE = 5;
  STATE_AWAITING_MODE_CHOICE = 6;
  STATE_SCR_CONSENT = 7;
  STATE_SCR_INTRO = 8;
  STATE_SCR_ASRS_A = 9;
  STATE_SCR_ASRS_A_GATE = 10;
  STATE_SCR_ASRS_B = 11;
  STATE_SCR_ASRS_B_GATE = 12;
  STATE_SCR_WURS_FORM = 13;
  STATE_SCR_WURS = 14;
  STATE_SCR_WURS_GATE = 15;
  STATE_SCR_ONSET = 16;
  STATE_SCR_ONSET_AGE = 17;
  STATE_SCR_DOMAINS_ADULT = 18;
  STATE_SCR_DOMAINS_CHILD = 19;
  STATE_SCR_REFERRAL = 20;
  STATE_SCR_REPORT = 21;
  STATE_SCR_DELETE_CONFIRM = 22;
  STATE_AWAITING_PRODUCT_CATEGORY = 23;
  STATE_MOOD_CONSENT = 24;
  STATE_MOOD_QUESTION = 25;
  STATE_MOOD_CRISIS = 26;
  STATE_MOOD_REPORT = 27;
  STATE_MOOD_DELETE_CONFIRM = 28;
  STATE_MOOD_MENU = 29;
  STATE_MOOD_Q10 = 30;
  STATE_MOOD_WHO5_QUESTION = 31;
  STATE_MOOD_OFFER_PHQ9 = 32;
  STATE_MOOD_GAD7_QUESTION = 33;
  STATE_MOOD_OFFER_GAD7 = 34;
  STATE_EAT_CONSENT = 35;
  STATE_EAT_MENU = 36;
  STATE_EAT_EDEQS_QUESTION = 37;
  STATE_EAT_BES_QUESTION = 38;
  STATE_EAT_NIAS_QUESTION = 39;
  STATE_EAT_REPORT = 40;
  STATE_EAT_DELETE_CONFIRM = 41;
  // Pushup track (pu_*). STATE_PU_REST is the first state the reminder loop
  // scans for a within-session ping; the rest are ordinary input states.
  STATE_PU_CONSENT = 42;
  STATE_PU_GATE = 43;
  STATE_PU_GOAL = 44;
  STATE_PU_VARIATION = 45;
  STATE_PU_TEST = 46;
  STATE_PU_MENU = 47;
  STATE_PU_SET = 48;
  STATE_PU_REST = 49;
  STATE_PU_EFFORT = 50;
  STATE_PU_WEEK_FORK = 51;
  STATE_PU_RED_CARD = 52;
  STATE_PU_PROGRESS = 53;
  STATE_PU_DELETE_CONFIRM = 54;
}

enum DefecationKind {
  DEFECATION_UNSPECIFIED = 0;
  DEFECATION_FLUID = 1;
  DEFECATION_NORMAL = 2;
  DEFECATION_ISSUES = 3;
}

message ProductProgress {
  tgbase.products.v1.Stage last_stage = 1;
  string status = 2;  // in_progress|completed|not_tolerated|interrupted
  google.protobuf.Timestamp updated_at = 3;
}

// ScreeningProgress mirrors state.ScreeningProgress — the TRANSIENT
// unfinished ADHD-screening run (raw per-question answers live only here;
// wiped on completion / restart / abandon / delete).
message ScreeningProgress {
  repeated int32 asrs_answers = 1;   // append-only, scores 0..4; index = id-1
  repeated int32 wurs_answers = 2;   // append-only, scores 0..4
  string wurs_form = 3;              // "m" | "f"
  optional bool onset_child = 4;     // absent = not asked yet
  int32 onset_age = 5;               // >0 when onset_child == false
  repeated string adult_domains = 6; // only the ids answered "yes"
  repeated string child_domains = 7; // only the ids answered "yes"
  StateKind resume_state = 8;
  google.protobuf.Timestamp consent_at = 9;
  google.protobuf.Timestamp started_at = 10;
  int32 adult_domain_idx = 11;       // domains answered so far (yes AND no)
  int32 child_domain_idx = 12;       // domains answered so far (yes AND no)
}

// ScreeningResult mirrors state.ScreeningResult — the last completed run:
// scores + applied thresholds + context facts, never per-question answers.
message ScreeningResult {
  google.protobuf.Timestamp taken_at = 1;
  int32 asrs_a_significant = 2;      // 0..6
  int32 asrs_a_threshold = 3;        // applied threshold (4)
  bool asrs_a_positive = 4;
  int32 asrs_b_significant = 5;      // 0..12, no threshold by design
  int32 wurs_score = 6;              // 0..100
  int32 wurs_cutoff = 7;             // applied cutoff (46)
  bool wurs_positive = 8;
  bool onset_childhood = 9;
  int32 onset_age = 10;              // 0 when onset_childhood
  repeated string adult_domains = 11;
  repeated string child_domains = 12;
  string verdict = 13;               // consistent | partial | not_consistent
  string gap_hint = 14;              // gap-hint key when partial
}

// MoodProgress mirrors state.MoodProgress — the TRANSIENT unfinished run of
// one mood-module instrument (PHQ-9 in `mood`, WHO-5 in `who5`, GAD-7 in
// `gad7`; raw per-question answers live only here; wiped on completion /
// restart / abandon / delete).
message MoodProgress {
  repeated int32 answers = 1;        // append-only; index = id-1 (PHQ-9 index 9 = the functional item)
  StateKind resume_state = 2;        // recorded escape position (PHQ-9 question/crisis/q10, WHO-5/GAD-7 question)
  google.protobuf.Timestamp consent_at = 3;  // legacy (v1 per-run consent); module consent lives on UserData
  google.protobuf.Timestamp started_at = 4;
}

// MoodResult mirrors state.MoodResult — the last completed PHQ-9 run: total
// score + applied severity band + the item-9 flag + the answer to the
// functional (10th) item, never the per-question answers 1..9.
message MoodResult {
  google.protobuf.Timestamp taken_at = 1;
  int32 score = 2;                   // 0..27 (functional item NOT included)
  string severity = 3;               // applied severity-band id
  bool q9_positive = 4;              // self-harm item answered > 0
  bool q10_answered = 5;             // functional item was shown and answered
  int32 q10_answer = 6;              // 0..3, meaningful only when q10_answered
}

// Who5Result mirrors state.Who5Result — the last completed WHO-5 quick check:
// the 0–100 score (raw 0–25 sum × 4) + the applied interpretation band.
message Who5Result {
  google.protobuf.Timestamp taken_at = 1;
  int32 score = 2;                   // 0..100
  string band = 3;                   // ok | low | very_low
}

// Gad7Result mirrors state.Gad7Result — the last completed GAD-7 run: total
// score + applied severity band, never per-question answers.
message Gad7Result {
  google.protobuf.Timestamp taken_at = 1;
  int32 score = 2;                   // 0..21
  string severity = 3;               // minimal | mild | moderate | severe
}

// EatingProgress mirrors state.EatingProgress — the TRANSIENT unfinished run
// of one eating-track instrument (EDE-QS in `edeqs`, BES in `bes`, NIAS in
// `nias`; raw per-question answers live only here; wiped on completion /
// restart / abandon / delete). Answers hold the picked option's score, so a
// BES answer is the weight of the chosen statement, not its position.
message EatingProgress {
  repeated int32 answers = 1;        // append-only; index = item id - 1
  StateKind resume_state = 2;        // recorded escape position (the run's question state)
  google.protobuf.Timestamp started_at = 3;
}

// EdeqsResult mirrors state.EdeqsResult — the last completed EDE-QS run: the
// 0–36 sum, the applied screening cutoff and the verdict it produced.
message EdeqsResult {
  google.protobuf.Timestamp taken_at = 1;
  int32 score = 2;                   // 0..36
  int32 cutoff = 3;                  // applied cutoff (15)
  bool positive = 4;                 // score >= cutoff
}

// BesResult mirrors state.BesResult — the last completed BES run: the 0–46
// sum and the applied severity band, never the per-item statements.
message BesResult {
  google.protobuf.Timestamp taken_at = 1;
  int32 score = 2;                   // 0..46
  string band = 3;                   // low | moderate | severe
}

// NiasResult mirrors state.NiasResult — the last completed NIAS run: the
// three subscale sums with the cutoffs that were applied to them. There is
// no NIAS total by design — the instrument is read per subscale.
message NiasResult {
  google.protobuf.Timestamp taken_at = 1;
  int32 picky = 2;                   // 0..15
  int32 appetite = 3;                // 0..15
  int32 fear = 4;                    // 0..15
  int32 picky_cutoff = 5;            // applied cutoff (10)
  int32 appetite_cutoff = 6;         // applied cutoff (9)
  int32 fear_cutoff = 7;             // applied cutoff (10)
  bool picky_positive = 8;
  bool appetite_positive = 9;
  bool fear_positive = 10;
}

// PushupProgram mirrors state.PushupProgram — the PERSISTENT state of the
// pushup track (absent = the track was never started). `base` is the single
// variable the generator reads: every rep count the user sees is derived
// from it by internal/screening, so no table of numbers is persisted here.
// The cosmetic level (1 + base/step) is derived on display, never stored.
message PushupProgram {
  string variation = 1;              // ladder rung id (wall … feet_up)
  string goal = 2;                   // reps | strength — branches the plateau logic for life
  int32 base = 3;                    // B, the last max-test result; >= min_base once tested
  int32 week_idx = 4;                // completed weeks
  int32 session_in_week = 5;         // 0..sessions_per_week-1, also the generator's day index
  repeated string week_outcomes = 6; // over|plan|short of the CURRENT week, <= sessions_per_week
  int32 repeat_count = 7;            // consecutive repeated weeks (fork at repeat_fork_after)
  double effort_adj = 8;             // accumulated self-report factor, clamped by the content
  int32 rest_bonus_sec = 9;          // the one-off "+30 s to everything"
  int32 sessions_done = 10;
  int32 sessions_since_test = 11;    // retest is due at retest_every_sessions
  int32 total_reps = 12;             // lifetime volume (a never-decreasing metric)
  google.protobuf.Timestamp last_session_at = 13;
  google.protobuf.Timestamp next_due_at = 14;  // data-driven scan key of the "time to train" ping
  bool due_ping_sent = 15;           // at most one due ping per due date
  int32 streak_weeks = 16;
  google.protobuf.Timestamp freeze_used_at = 17;
  google.protobuf.Timestamp started_at = 18;
  int32 gate_idx = 19;               // safety-gate questions answered during setup
  int32 start_step_down = 20;        // rungs the gate asked to start below the picked one
  bool deload = 21;                  // next session runs reduced (dropped retest / long pause)
  bool retest_pending = 22;          // a retest is owed before the next ordinary session
}

// PushupSession mirrors state.PushupSession — the TRANSIENT unfinished
// session (absent when none). `targets` is variable-length (4..7) because
// the set count grows with the base, and its LAST element is the floor of
// the open set, which is why there are no fixed per-set fields.
message PushupSession {
  string kind = 1;                   // workout | test | retest
  int32 day_idx = 2;                 // 0..sessions_per_week-1
  repeated int32 targets = 3;        // fixed sets + the open set's floor (last)
  int32 open_floor = 4;              // == last element of targets, kept for readability
  repeated int32 actual = 5;         // append-only, index-aligned with targets
  int32 idx = 6;                     // cursor: the set being performed
  int32 rest_sec = 7;                // rest planned between sets of THIS session
  google.protobuf.Timestamp rest_until = 8;  // scan key of the rest-over ping
  google.protobuf.Timestamp started_at = 9;  // session TTL is measured from here
  StateKind resume_state = 10;       // recorded escape position (pu_set | pu_rest)
}

// PushupTest mirrors state.PushupTest — the last COMPLETED max test. Kept
// apart from the program exactly like ScreeningResult is kept apart from
// ScreeningProgress: the test is a reproducible measurement, the program is
// the mutable load built on top of it.
message PushupTest {
  google.protobuf.Timestamp taken_at = 1;
  string variation = 2;              // the rung the test was taken on
  int32 reps = 3;
  bool capped = 4;                   // hit the test ceiling → offer a harder rung
  string source = 5;                 // initial | retest
}

// PushupSessionLog mirrors state.PushupSessionLog — one finished session in
// the history ring. Numbers only, never free text; the ring is capped
// (history_cap) because this is the only track that keeps a history rather
// than just the last result.
message PushupSessionLog {
  google.protobuf.Timestamp date = 1;
  int32 day_idx = 2;
  repeated int32 sets = 3;           // what was actually done, per set
  int32 planned = 4;                 // planned volume (fixed sets + open floor)
  int32 done = 5;                    // actual volume
  int32 open_target = 6;
  int32 open_actual = 7;
  string outcome = 8;                // over | plan | short
  string effort = 9;                 // hard | ok | easy
  int32 base = 10;                   // the base this session was generated from
}

message UserData {
  StateKind state = 1;
  DefecationKind defecation_state = 2;
  string current_product = 3;
  tgbase.products.v1.Stage current_stage = 4;
  google.protobuf.Timestamp stage_started_at = 5;
  bool checkin_asked = 6;
  repeated string offered_products = 7;
  map<string, ProductProgress> products = 8;
  int64 chat_id = 9;
  google.protobuf.Timestamp entered_at = 10;
  bool reminder_sent = 11;
  string locale = 12;
  ScreeningProgress screening = 13;
  ScreeningResult screening_result = 14;
  StateKind return_state = 15;
  MoodProgress mood = 16;
  MoodResult mood_result = 17;
  // Mood module v2: one consent for the whole module (wiped by /mood_delete),
  // per-instrument transient runs and last completed results.
  google.protobuf.Timestamp mood_consent_at = 18;
  MoodProgress who5 = 19;
  MoodProgress gad7 = 20;
  Who5Result who5_result = 21;
  Gad7Result gad7_result = 22;
  // Eating track (EDE-QS + BES + NIAS): one consent for the whole track
  // (wiped by /food_delete), per-instrument transient runs and last
  // completed results. No combined index — same rule as the other tracks.
  google.protobuf.Timestamp eat_consent_at = 23;
  EatingProgress edeqs = 24;
  EdeqsResult edeqs_result = 25;
  EatingProgress bes = 26;
  BesResult bes_result = 27;
  EatingProgress nias = 28;
  NiasResult nias_result = 29;
  // Pushup track: one consent for the whole track (wiped by /pushups_delete),
  // the persistent program, the transient session, the last max test and the
  // capped history ring. This is the first track that persists a program and
  // a history instead of a single last result.
  google.protobuf.Timestamp pu_consent_at = 30;
  PushupProgram pushups = 31;
  PushupSession pu_session = 32;
  PushupTest pu_test = 33;
  repeated PushupSessionLog pu_history = 34;
}

message UserMap {
  map<int64, UserData> users = 1;
}
