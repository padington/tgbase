# DSM-контекстный модуль скрининга СДВГ у взрослых (ru) — tgbase, гибрид v1.
#
# Происхождение текста: ВЕСЬ текст этого файла написан с нуля авторами бота.
# Дословные тексты шкал сюда НЕ входят: вопросы ASRS v1.1 (официальная русская
# версия ВОЗ) и WURS-25 живут в своих модулях. Этот файл — только наш
# собственный контент: согласие, интро, вопрос о начале трудностей,
# вопросы по жизненным сферам, шаблоны результата и служебные тексты.
# Формулировки критериев DSM-5 переданы своими словами (текст критериев —
# копирайт APA и не воспроизводится дословно).
#
# Стиль пользовательских текстов: коротко и по делу. Методологические
# оговорки (статус переводов, валидация порогов и т.п.) пользователю не
# показываются — они остаются в комментариях модулей шкал и в docs;
# пользователь видит только короткий дисклеймер «скрининг, а не диагноз»
# и одну компактную строку атрибуций в подвале результата.
#
# Подстановки — в синтаксисе i18n-бандлов репозитория: {имя_плейсхолдера}.
# Команды /adhd, /adhd_delete, /abandon — предложения в духе конвенций репо,
# при интеграции можно переименовать (тогда поправить и тексты ниже).

meta:
  module: "adhd_dsm_context"
  version: 2
  language: "ru"
  title: "Самопроверка на СДВГ у взрослых"
  # Легаси-поля (не рендерятся с v2, удаляются вместе с кодом старого интро):
  attribution_asrs: >-
    Шкала самоотчёта о СДВГ у взрослых ASRS v1.1 разработана при участии
    Всемирной организации здравоохранения (Kessler R.C. и соавт., 2005).
    © New York University и Ronald C. Kessler.
  attribution_wurs: >-
    Шкала ретроспективной оценки WURS-25 (Ward M.F., Wender P.H.,
    Reimherr F.W., 1993).
  attribution_context: >-
    Вопросы о начале трудностей и жизненных сферах составлены авторами бота
    по мотивам диагностических критериев DSM-5.
  disclaimer: >-
    Это скрининг, а не диагноз: диагноз ставит только специалист на очной
    консультации. Результат — повод обсудить тему с врачом.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Согласие на обработку данных о здоровье
# ─────────────────────────────────────────────────────────────────────────────
consent:
  title: "Прежде чем начнём — про твои данные"
  body: >-
    Ответы в этом тесте касаются здоровья, а это чувствительные данные,
    поэтому спрошу прямо.


    Что я сохраню: только итоговые баллы по каждой шкале, отмеченные тобой
    жизненные сферы, ответ о возрасте начала трудностей и дату прохождения.
    Ответы на отдельные вопросы после подсчёта не хранятся.


    Зачем: чтобы показать тебе результат, собрать сводный отчёт для врача
    и напоминать итог в /report.


    Твои права: команда /adhd_delete в любой момент стирает всё сохранённое
    по этому тесту. Никому третьему данные не передаются.
  agree_button: "Согласен(а), начинаем"
  later_button: "Не сейчас"
  declined: >-
    Хорошо, ничего не записываю. Тест можно запустить позже командой /adhd —
    остальные функции бота работают как обычно.

# ─────────────────────────────────────────────────────────────────────────────
# 2. Интро: что это за скрининг
# ─────────────────────────────────────────────────────────────────────────────
intro:
  title: "Что это за проверка"
  body: >-
    Это самопроверка на признаки СДВГ у взрослых из трёх частей:


    1) ASRS v1.1 — скрининговая шкала, разработанная при участии ВОЗ:
    часть A (6 вопросов) и часть B (12 вопросов).

    2) WURS-25 — 25 вопросов о том, каким ты был(а) в детстве.

    3) Несколько вопросов для контекста: когда начались трудности и каким
    сферам жизни они мешают.


    Всего примерно 15–20 минут. Идём поэтапно: после каждого блока можно
    сделать паузу — прогресс не потеряется.
  start_button: "Начать"
  postpone_button: "Вернусь позже"

# ─────────────────────────────────────────────────────────────────────────────
# 3. Вопрос о начале трудностей (концепт критерия B DSM-5 — своими словами)
# ─────────────────────────────────────────────────────────────────────────────
criterion_b:
  title: "Когда это началось"
  question: >-
    Вспомни себя в начальной школе, лет до двенадцати. Что-то из трудностей,
    которые ты отмечал(а) выше, было заметно уже тогда? Например, учителя
    жаловались на невнимательность, вещи регулярно терялись, а высидеть
    урок целиком было мучением.
  yes_label: "Да, уже тогда"
  no_label: "Нет, это появилось позже"
  no_followup: >-
    А когда, по твоим ощущениям, эти трудности появились? Напиши примерный
    возраст числом — например: 16
  age_invalid: "Напиши возраст одним числом, например: 16"
  # Факт для результата и отчёта врачу (без баллов):
  onset_fact_childhood: "похожие трудности были заметны уже до 12 лет"
  onset_fact_later: "по самоотчёту трудности появились примерно с {age} лет"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Жизненные сферы (концепты критериев C и D DSM-5 — своими словами):
#    5 сфер × две фазы жизни, по одному короткому вопросу да/нет на сферу.
#    Примеры — собственные формулировки, 2–3 самых узнаваемых на сферу.
# ─────────────────────────────────────────────────────────────────────────────
domains:
  adult_prompt: "Теперь несколько коротких вопросов про жизнь сейчас — по одной сфере за раз."
  childhood_prompt: "И то же самое про школьные годы, примерно с 5 до 12 лет."
  position_adult: "Сфера {current} из {total} · зрелость"
  position_child: "Сфера {current} из {total} · детство (5–12 лет)"
  examples_line: "Например: {examples}."
  question: "Были ли заметные трудности?"
  yes_button: "Да"
  no_button: "Нет"
  # Легаси-поля старого мультивыбора (не рендерятся с v2):
  multiselect_hint: "Нажимай на кнопки — отметки переключаются. Когда закончишь, жми «Готово»."
  done_button: "Готово"
  none_button: "Ни одна не мешает"
  items:
    - id: work_study
      adult:
        title: "Работа и учёба"
        examples:
          - "интерес к проекту гаснет задолго до финиша"
          - "отчёты доделываются в последнюю ночь перед дедлайном"
          - "на созвонах мысли уплывают"
      childhood:
        title: "Учёба в школе"
        examples:
          - "оценки ниже способностей"
          - "домашка на полчаса растягивалась на весь вечер"
          - "замечания «отвлекается» в дневнике"
    - id: relationships_family
      adult:
        title: "Отношения и семья"
        examples:
          - "счета и планирование тянет на себе партнёр"
          - "обещания по дому повисают неделями"
          - "ссоры из-за забытых договорённостей"
      childhood:
        title: "Семья"
        examples:
          - "стычки с братьями и сёстрами на ровном месте"
          - "наказаний больше, чем другим детям"
          - "родители контролировали уроки дольше, чем у сверстников"
    - id: social
      adult:
        title: "Общение с людьми"
        examples:
          - "сообщения лежат без ответа днями"
          - "тянет перебить собеседника"
          - "старые дружбы затухают"
      childhood:
        title: "Общение со сверстниками"
        examples:
          - "друзей мало или дружбы быстро распадались"
          - "игры по правилам кончались ссорой"
          - "дразнили или не звали в компанию"
    - id: leisure
      adult:
        title: "Свободное время и хобби"
        examples:
          - "полка недочитанных книг и брошенные сериалы"
          - "хобби увлекают на месяц и забываются"
          - "«пять минут в телефоне» превращаются в три часа"
      childhood:
        title: "Игры и свободное время"
        examples:
          - "игры и мультики бросались на середине"
          - "секции менялись одна за другой"
          - "«посиди спокойно» было пыткой"
    - id: self_esteem
      adult:
        title: "Самооценка"
        examples:
          - "внутренний голос «опять не доведёшь до конца»"
          - "чувство, что живёшь не в полную силу"
          - "замечания задевают сильнее, чем «должны бы»"
      childhood:
        title: "Уверенность в себе"
        examples:
          - "клеймо «способный, но ленивый»"
          - "сравнения с более собранными одноклассниками"
          - "ощущение: стараешься как все, а получается хуже"

# ─────────────────────────────────────────────────────────────────────────────
# 5. Результаты: по строке на инструмент, факты контекста, три итоговые
#    формулировки, маршрут к специалисту, отчёт для врача.
# ─────────────────────────────────────────────────────────────────────────────
results:
  heading: "Твой результат"
  # Легаси-поле (не рендерится с v2):
  instruments_note: >-
    Каждая шкала считается отдельно, у каждой свой порог.
  instruments:
    asrs_a:
      title: "ASRS v1.1, часть A — основной скрининг"
      score_line: "{score} из 6 ответов в значимой зоне (порог: 4 и больше)."
      positive_line: "Скрининг положительный: симптомный порог шкалы достигнут."
      negative_line: "Скрининг отрицательный: симптомный порог шкалы не достигнут."
      # Легаси-поле (не рендерится с v2):
      attribution: "ASRS v1.1 © ВОЗ/Kessler."
    asrs_b:
      title: "ASRS v1.1, часть B — дополнительные симптомы"
      score_line: "{score} из 12 ответов в значимой зоне."
      note: >-
        У части B нет формального порога — это дополнительная картина
        симптомов, полезная врачу на консультации.
      # Легаси-поле (не рендерится с v2):
      attribution: "ASRS v1.1 © ВОЗ/Kessler."
    wurs:
      title: "WURS-25 — ретроспектива детства"
      score_line: "{score} из 100 баллов (порог: 46 и больше)."
      positive_line: "Балл выше порога: ретроспектива детства даёт значимый сигнал."
      negative_line: "Балл ниже порога: выраженного сигнала из детства шкала не видит."
      # Легаси-поля (не рендерятся с v2):
      caveat: "Балл — ориентир для разговора с врачом."
      attribution: "WURS-25: Ward, Wender, Reimherr, 1993."
  # Единственная атрибуция, которую видит пользователь, — одной строкой
  # в подвале результата:
  attribution_line: "ASRS v1.1 © ВОЗ/Kessler · WURS-25 — Ward et al. · вопросы контекста — на основе критериев DSM-5"
  context_facts:
    heading: "Жизненный контекст"
    onset_line: "Начало: {onset_fact}."
    adult_domains_line: "Сферы, где мешает сейчас: {adult_domains}."
    adult_domains_empty: "Сейчас ни одна сфера, по твоей оценке, заметно не страдает."
    child_domains_line: "Сферы с трудностями в школьные годы: {child_domains}."
    child_domains_empty: "В школьные годы заметных трудностей по сферам ты не отметил(а)."
  overall:
    # Правило выбора варианта — на стороне кода; ориентир для интеграции:
    # consistent      — ASRS-A положительный И начало до 12 лет И ≥2 «взрослых» сфер;
    # partial         — часть этих условий выполнена;
    # not_consistent  — не выполнено ни одно ключевое условие.
    consistent: >-
      Итог: картина из твоих ответов — выраженные симптомы сейчас, похожие
      трудности с детства и влияние на несколько сфер жизни — согласуется
      с паттерном, описанным в критериях DSM-5. Это весомый повод дойти до
      специалиста и разобраться очно.
    partial: >-
      Итог: картина складывается частично — {gap_hint}. Однозначного ответа
      такой паттерн не даёт. Если трудности ощутимо мешают жить, консультация
      специалиста всё равно имеет смысл: разбираться с этим очно — нормально
      и при неоднозначном скрининге.
    not_consistent: >-
      Итог: паттерн твоих ответов не согласуется с критериями DSM-5.
      Это не обесценивает твои трудности — если что-то мешает жить,
      это стоит обсудить с врачом: у похожих проявлений бывают совсем
      другие причины, от недосыпа до тревоги и депрессии.
    gap_hints:
      no_childhood_onset: "симптомы заметны сейчас, но в детстве, по твоим ответам, картина не прослеживается"
      no_current_symptoms: "детская ретроспектива даёт сигнал, но текущие симптомы до порога скрининга не дотягивают"
      few_domains: "симптомы есть, но заметного влияния минимум на две сферы жизни ты не отметил(а)"
  # Легаси-поле (не рендерится с v2):
  criterion_e_note: >-
    Исключение других причин — задача врача.
  referral:
    heading: "Куда с этим идти"
    body: >-
      Диагностикой СДВГ у взрослых занимается врач-психиатр или
      врач-психотерапевт — в ПНД, поликлинике или частной клинике.
      Возьми с собой сводный отчёт из следующего сообщения — он сэкономит
      время на приёме.
  doctor_report:
    lead_in: "Сводный отчёт для специалиста — можно переслать или показать с экрана:"
    template: |-
      СВОДНЫЙ ОТЧЁТ СКРИНИНГА НА СДВГ (самоотчёт, телеграм-бот)
      Дата прохождения: {date}

      Шкалы (каждая считается отдельно):
      1. ASRS v1.1, часть A: {asrs_a_score}/6 значимых ответов (порог скрининга ≥4) — {asrs_a_verdict}.
      2. ASRS v1.1, часть B: {asrs_b_score}/12 значимых ответов (формального порога нет).
      3. WURS-25: {wurs_score}/100 (порог ≥46) — {wurs_verdict}.

      Контекст:
      — Начало трудностей: {onset_fact}.
      — Сферы с заметными трудностями сейчас: {adult_domains}.
      — Сферы с трудностями в возрасте 5–12 лет: {child_domains}.

      Это скрининг, а не диагноз. ASRS v1.1 © ВОЗ/Kessler; WURS-25 — Ward et al.; вопросы контекста — на основе критериев DSM-5.

# ─────────────────────────────────────────────────────────────────────────────
# 6. Служебные тексты бота: границы блоков, пауза, прогресс, отмена, удаление.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  mode_button: "Самопроверка СДВГ"
  progress: "Вопрос {current} из {total}"
  continue_button: "Продолжить"
  pause_button: "Сделать паузу"
  paused: >-
    Пауза. Вернуться можно командой /adhd — продолжим ровно с этого места.
  resumed: "С возвращением! Продолжаем с того места, где остановились."
  block_boundaries:
    after_asrs_a: >-
      Первый блок готов — это был основной скрининг ВОЗ. Дальше часть B
      той же шкалы: 12 вопросов, минуты четыре. Продолжим?
    after_asrs_b: >-
      Шкала ASRS пройдена целиком. Следующий блок — 25 вопросов о том,
      каким ты был(а) в детстве (WURS-25), минут семь. Продолжим?
    after_wurs: >-
      Остался последний короткий блок: когда начались трудности и каким
      сферам жизни они мешают. Минуты три — и покажу результат.
  abandon_confirmed: >-
    Тест прерван, ответы этой сессии удалены. Захочешь пройти заново —
    команда /adhd.
  abandon_no_active: "Сейчас нет начатого теста."
  delete_confirm_prompt: >-
    Удалить все сохранённые результаты самопроверки СДВГ? Это действие
    необратимо.
  delete_confirm_button: "Да, удалить"
  delete_cancel_button: "Оставить"
  delete_done: "Готово: все результаты самопроверки СДВГ удалены."
  delete_nothing: "Сохранённых результатов нет — удалять нечего."
  fodmap_guard: >-
    У тебя сейчас идёт тест продукта в дневнике. Самопроверка СДВГ его
    не затронет — прогресс дневника сохранится. Начинаем?

# ─────────────────────────────────────────────────────────────────────────────
# 7. Трассируемость: наши вопросы → критерии DSM-5 (для docs репозитория).
# ─────────────────────────────────────────────────────────────────────────────
traceability:
  purpose: >-
    Показывает, какой элемент гибридного скрининга закрывает какой концепт
    критериев DSM-5. Дословный текст критериев не воспроизводится
    (копирайт APA) — критерии обозначены буквами и пересказаны кратко.
  rows:
    - ours: "ASRS v1.1, часть A (6 вопросов, официальный текст ВОЗ)"
      dsm: "Критерий A (частично)"
      note: >-
        Шесть пунктов, статистически отобранных ВОЗ из 18 симптомов DSM
        как лучший скрининговый предиктор; порог — ≥4 значимых ответа.
    - ours: "ASRS v1.1, часть B (12 вопросов, неофициальный перевод)"
      dsm: "Критерий A (остальные симптомы)"
      note: >-
        Вместе части A и B покрывают все 18 симптомов DSM (9 невнимательности
        A1a–A1i, 9 гиперактивности/импульсивности A2a–A2i). Формального
        порога у части B нет.
    - ours: "criterion_b.question — наш вопрос «было ли похожее до 12 лет» + возраст при «нет»"
      dsm: "Критерий B"
      note: "Концепт «несколько симптомов присутствовали до 12 лет», своя формулировка."
    - ours: "WURS-25 (ретроспектива детства, неофициальный перевод)"
      dsm: "Критерий B (поддерживающе)"
      note: >-
        Не прямое отображение критерия: шкала количественно подкрепляет
        самоотчёт о детском начале. В результатах балл идёт отдельной строкой
        со своим порогом.
    - ours: "domains, фаза «зрелость» — 5 сфер по одному вопросу да/нет (work_study, relationships_family, social, leisure, self_esteem)"
      dsm: "Критерии C и D"
      note: >-
        Концепты «проявления в двух и более обстановках» (C) и «явное
        снижение качества функционирования» (D); ориентир интеграции —
        «да» по ≥2 сферам. Самооценка — сфера-индикатор дистресса,
