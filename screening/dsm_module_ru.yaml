# DSM-контекстный модуль скрининга СДВГ у взрослых (ru) — tgbase, гибрид v1.
#
# Происхождение текста: ВЕСЬ текст этого файла написан с нуля авторами бота.
# Дословные тексты шкал сюда НЕ входят: вопросы ASRS v1.1 (официальная русская
# версия ВОЗ) и WURS-25 живут в своих модулях. Этот файл — только наш
# собственный контент: согласие, интро, вопрос о начале трудностей,
# мультивыбор жизненных сфер, шаблоны результата и служебные тексты.
# Формулировки критериев DSM-5 переданы своими словами (текст критериев —
# копирайт APA и не воспроизводится дословно).
#
# Подстановки — в синтаксисе i18n-бандлов репозитория: {имя_плейсхолдера}.
# Команды /adhd, /adhd_delete, /abandon — предложения в духе конвенций репо,
# при интеграции можно переименовать (тогда поправить и тексты ниже).

meta:
  module: "adhd_dsm_context"
  version: 1
  language: "ru"
  title: "Самопроверка на СДВГ у взрослых"
  # Атрибуции инструментов — используются в интро и в результатах.
  attribution_asrs: >-
    Шкала самоотчёта о СДВГ у взрослых ASRS v1.1 разработана при участии
    Всемирной организации здравоохранения (Kessler R.C. и соавт., 2005).
    © New York University и Ronald C. Kessler. Часть A (вопросы 1–6) —
    официальная русская версия текста без изменений; часть B (вопросы 7–18) —
    неофициальный перевод с официального английского текста: официальной
    русской версии части B не существует.
  attribution_wurs: >-
    Шкала ретроспективной оценки WURS-25 (Ward M.F., Wender P.H.,
    Reimherr F.W., 1993). Официального русского перевода не существует;
    использован неофициальный перевод — врач при необходимости сверится
    с оригиналом.
  attribution_context: >-
    Вопросы о начале трудностей и жизненных сферах составлены авторами бота
    по мотивам диагностических критериев DSM-5 (Американская психиатрическая
    ассоциация) и не являются стандартизированной шкалой.
  disclaimer: >-
    Это скрининг, а не диагностика. Никакой опросник — тем более в чате —
    не ставит и не снимает диагноз. Результат лишь показывает, есть ли
    смысл обсудить тему с врачом. Похожие трудности бывают и по другим
    причинам (сон, тревога, депрессия, стресс, соматика) — бот это
    не проверяет.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Согласие на обработку данных о здоровье
# ─────────────────────────────────────────────────────────────────────────────
consent:
  title: "Прежде чем начнём — про твои данные"
  body: >-
    Ответы в этом тесте касаются здоровья, а это чувствительные данные,
    поэтому спрошу прямо.


    Что я сохраню: только итоговые баллы по каждой шкале, отмеченные тобой
    жизненные сферы, ответ о возрасте начала трудностей и дату прохождения.
    Ответы на отдельные вопросы после подсчёта не хранятся.


    Зачем: чтобы показать тебе результат, собрать сводный отчёт для врача
    и напоминать итог в /report.


    Твои права: команда /adhd_delete в любой момент стирает всё сохранённое
    по этому тесту. Никому третьему данные не передаются.
  agree_button: "Согласен(а), начинаем"
  later_button: "Не сейчас"
  declined: >-
    Хорошо, ничего не записываю. Тест можно запустить позже командой /adhd —
    остальные функции бота работают как обычно.

# ─────────────────────────────────────────────────────────────────────────────
# 2. Интро: что это за скрининг
# ─────────────────────────────────────────────────────────────────────────────
intro:
  title: "Что это за проверка"
  body: >-
    Это самопроверка на признаки СДВГ у взрослых из трёх частей:


    1) ASRS v1.1 — скрининговая шкала, разработанная при участии ВОЗ.
    Сначала часть A (6 вопросов, основной скрининг) — официальный русский
    текст, без изменений. Затем часть B (12 вопросов) — официального
    русского перевода этой части нет, вопросы переведены нами с
    официального английского текста.

    2) WURS-25 — 25 вопросов о том, каким ты был(а) в детстве.
    Перевод на русский неофициальный — скажу об этом ещё раз в результатах.

    3) Несколько наших вопросов для контекста по критериям DSM-5:
    когда начались трудности и каким сферам жизни они мешают.


    Всего примерно 15–20 минут. Идём поэтапно: после каждого блока
    предложу продолжить или сделать паузу — прогресс не потеряется.


    Важно: это скрининг, а не диагноз. Диагноз ставит только специалист
    на очной диагностике. Результат теста — повод для разговора с врачом,
    не вердикт.
  start_button: "Начать"
  postpone_button: "Вернусь позже"

# ─────────────────────────────────────────────────────────────────────────────
# 3. Вопрос о начале трудностей (концепт критерия B DSM-5 — своими словами)
# ─────────────────────────────────────────────────────────────────────────────
criterion_b:
  title: "Когда это началось"
  question: >-
    Вспомни себя в начальной школе, лет до двенадцати. Что-то из трудностей,
    которые ты отмечал(а) выше, было заметно уже тогда? Например, учителя
    жаловались на невнимательность, вещи регулярно терялись, а высидеть
    урок целиком было мучением.
  yes_label: "Да, уже тогда"
  no_label: "Нет, это появилось позже"
  no_followup: >-
    А когда, по твоим ощущениям, эти трудности появились? Напиши примерный
    возраст числом — например: 16
  age_invalid: "Напиши возраст одним числом, например: 16"
  # Факт для результата и отчёта врачу (без баллов):
  onset_fact_childhood: "похожие трудности были заметны уже до 12 лет"
  onset_fact_later: "по самоотчёту трудности появились примерно с {age} лет"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Жизненные сферы (концепты критериев C и D DSM-5 — своими словами):
#    5 сфер × две фазы жизни, мультивыбор. Примеры — собственные формулировки.
# ─────────────────────────────────────────────────────────────────────────────
domains:
  adult_prompt: >-
    Теперь про жизнь сейчас. Отметь сферы, в которых эти особенности
    реально мешают — не «бывает у всех», а ощутимо портят дела или
    отношения. Можно выбрать несколько, можно ни одной.
  childhood_prompt: >-
    И то же самое про школьные годы, примерно с 5 до 12 лет. В каких
    сферах тогда были заметные трудности?
  multiselect_hint: "Нажимай на кнопки — отметки переключаются. Когда закончишь, жми «Готово»."
  done_button: "Готово"
  none_button: "Ни одна не мешает"
  items:
    - id: work_study
      adult:
        title: "Работа и учёба"
        examples:
          - "Проекты стартуют с азартом, но интерес гаснет задолго до финиша"
          - "Отчёты и заявки доделываются в последнюю ночь перед дедлайном — или после него"
          - "Рабочие чаты и письма висят «прочитанными» неделями, пока кто-то не напомнит"
          - "На созвонах мысли уплывают, договорённости приходится переспрашивать"
          - "Работа меняется чаще, чем у коллег: на новом месте быстро становится скучно"
          - "Карьера растёт медленнее, чем у людей с теми же способностями"
      childhood:
        title: "Учёба в школе"
        examples:
          - "Оценки заметно ниже того, чего от тебя ждали «по способностям»"
          - "Домашка на полчаса растягивалась на весь вечер"
          - "В контрольных — обидные ошибки при выученном материале"
          - "В дневнике замечания: «отвлекается», «мешает вести урок»"
          - "«Хвосты» и пересдачи копились, хотя материал был по силам"
    - id: relationships_family
      adult:
        title: "Отношения и семья"
        examples:
          - "Счета, документы и планирование тянет на себе партнёр — иначе всё сыпется"
          - "Обещания по дому («закажу», «починю», «оплачу») повисают неделями"
          - "Ссоры из-за забытых договорённостей или брошенного сгоряча слова"
          - "Импульсивные покупки и подписки, о которых близкие узнают из выписки по карте"
          - "Отношения начинались стремительно — и так же стремительно заканчивались"
          - "С детьми тяжело держать режим: сборы, уроки, отбой — каждый день через хаос"
      childhood:
        title: "Семья"
        examples:
          - "Стычки с братьями и сёстрами вспыхивали на ровном месте"
          - "Наказаний доставалось больше, чем другим детям в семье"
          - "Родители контролировали уроки и сборы в школу дольше, чем у сверстников"
          - "Семейные застолья и поездки шли под аккомпанемент «угомонись наконец»"
    - id: social
      adult:
        title: "Общение с людьми"
        examples:
          - "Сообщения в мессенджерах лежат без ответа днями — не со зла, просто «потом»"
          - "Дни рождения и важные события друзей вылетают из головы даже с напоминалками"
          - "В разговоре тянет перебить или договорить фразу за собеседника"
          - "Старые дружбы затухают: написать первым всё никак не выходит"
          - "После встреч догоняет неловкость за сказанное не подумав"
      childhood:
        title: "Общение со сверстниками"
        examples:
          - "Друзей было мало, или дружбы быстро распадались"
          - "Игры по правилам кончались ссорой: дождаться своего хода было невыносимо"
          - "Дразнили или не звали в компанию"
          - "От сверстников липли ярлыки: «выскочка», «болтун», «не от мира сего»"
    - id: leisure
      adult:
        title: "Свободное время и хобби"
        examples:
          - "Полка недочитанных книг и список брошенных на середине сериалов"
          - "Дома склад снаряжения для хобби, которые увлекли на месяц и забылись"
          - "«Просто полежать» в отпуске не выходит — нужно движение и новые впечатления"
          - "Вечер «на пять минут в телефон» превращается в три часа скроллинга"
          - "Штрафы за скорость и рискованные манёвры за рулём"
          - "Расслабиться получается только после выматывающей тренировки"
      childhood:
        title: "Игры и свободное время"
        examples:
          - "Настольные игры и мультики бросались на середине"
          - "Секции менялись одна за другой: плавание, шахматы, карате — и всё ненадолго"
          - "Разбитые коленки и травмы чаще, чем у сверстников, — из-за лазанья и риска"
          - "Тихий час и любые «посиди спокойно» были пыткой"
    - id: self_esteem
      adult:
        title: "Самооценка"
        examples:
          - "Внутренний голос «опять не доведёшь до конца» при каждом новом начинании"
          - "Стойкое чувство, что живёшь не в полную силу по сравнению с потенциалом"
          - "Замечания задевают сильнее, чем «должны бы», и помнятся неделями"
          - "Либо идеально, либо никак: планка так высока, что проще не начинать"
          - "Стыд за сорванные сроки и забытые обещания копится годами"
      childhood:
        title: "Уверенность в себе"
        examples:
          - "Клеймо «способный, но ленивый» от учителей и родителей"
          - "Сравнения с более собранными одноклассниками или братьями-сёстрами били по уверенности"
          - "Страх снова услышать «опять ты…» отбивал желание пробовать новое"
          - "Ощущение: стараешься как все, а получается хуже"

# ─────────────────────────────────────────────────────────────────────────────
# 5. Результаты: по строке на инструмент, факты контекста, три итоговые
#    формулировки, маршрут к специалисту, отчёт для врача.
# ─────────────────────────────────────────────────────────────────────────────
results:
  heading: "Твой результат"
  instruments_note: >-
    Каждая шкала считается отдельно, у каждой свой порог. Сводного
    «процента СДВГ» не существует — так эти инструменты не работают.
  instruments:
    asrs_a:
      title: "ASRS v1.1, часть A — основной скрининг"
      score_line: "{score} из 6 ответов в значимой зоне (порог: 4 и больше)."
      positive_line: "Скрининг положительный: симптомный порог шкалы достигнут."
      negative_line: "Скрининг отрицательный: симптомный порог шкалы не достигнут."
      attribution: >-
        ASRS v1.1 разработана при участии ВОЗ (Kessler и соавт., 2005),
        © New York University и Ronald C. Kessler. Официальная русская версия.
    asrs_b:
      title: "ASRS v1.1, часть B — дополнительные симптомы"
      score_line: "{score} из 12 ответов в значимой зоне."
      note: >-
        У части B нет формального порога — это дополнительная картина
        симптомов, полезная врачу на консультации.
      attribution: >-
        Та же шкала ASRS v1.1; официальной русской версии части B не
        существует — вопросы даны в неофициальном переводе с официального
        английского текста.
    wurs:
      title: "WURS-25 — ретроспектива детства"
      score_line: "{score} из 100 баллов (часто используемый порог: 46 и больше)."
      positive_line: "Балл выше порога: ретроспектива детства даёт значимый сигнал."
      negative_line: "Балл ниже порога: выраженного сигнала из детства шкала не видит."
      caveat: >-
        Внимание: официального русского перевода WURS-25 нет, использован
        неофициальный. К баллу стоит относиться как к ориентиру.
      attribution: "WURS-25: Ward, Wender, Reimherr, 1993."
  context_facts:
    heading: "Контекст по критериям DSM-5 (наши вопросы, без баллов)"
    onset_line: "Начало: {onset_fact}."
    adult_domains_line: "Сферы, где мешает сейчас: {adult_domains}."
    adult_domains_empty: "Сейчас ни одна сфера, по твоей оценке, заметно не страдает."
    child_domains_line: "Сферы с трудностями в школьные годы: {child_domains}."
    child_domains_empty: "В школьные годы заметных трудностей по сферам ты не отметил(а)."
  overall:
    # Правило выбора варианта — на стороне кода; ориентир для интеграции:
    # consistent      — ASRS-A положительный И начало до 12 лет И ≥2 «взрослых» сфер;
    # partial         — часть этих условий выполнена;
    # not_consistent  — не выполнено ни одно ключевое условие.
    consistent: >-
      Итог: картина из твоих ответов — выраженные симптомы сейчас, похожие
      трудности с детства и влияние на несколько сфер жизни — согласуется
      с паттерном, описанным в критериях DSM-5. Это весомый повод дойти до
      специалиста и разобраться очно.
    partial: >-
      Итог: картина складывается частично — {gap_hint}. Однозначного ответа
      такой паттерн не даёт. Если трудности ощутимо мешают жить, консультация
      специалиста всё равно имеет смысл: разбираться с этим очно — нормально
      и при неоднозначном скрининге.
    not_consistent: >-
      Итог: паттерн твоих ответов не согласуется с критериями DSM-5.
      Это не обесценивает твои трудности — если что-то мешает жить,
      это стоит обсудить с врачом: у похожих проявлений бывают совсем
      другие причины, от недосыпа до тревоги и депрессии.
    gap_hints:
      no_childhood_onset: "симптомы заметны сейчас, но в детстве, по твоим ответам, картина не прослеживается"
      no_current_symptoms: "детская ретроспектива даёт сигнал, но текущие симптомы до порога скрининга не дотягивают"
      few_domains: "симптомы есть, но заметного влияния минимум на две сферы жизни ты не отметил(а)"
  criterion_e_note: >-
    Что бот не проверял: могут ли эти проявления объясняться другим
    состоянием — сном, тревогой, депрессией, щитовидкой и прочим
    (в DSM-5 это отдельный обязательный критерий). Это работа врача.
  referral:
    heading: "Куда с этим идти"
    body: >-
      Диагностикой СДВГ у взрослых занимается врач-психиатр (иногда —
      врач-психотерапевт). Психолог без медицинского образования диагноз
      не ставит. Идти можно в ПНД или поликлинику по месту жительства
      либо в частную клинику — при записи стоит спросить, работает ли
      специалист со взрослым СДВГ.


      Возьми с собой сводный отчёт (пришлю следующим сообщением) — он
      сэкономит время на приёме. Если врач сочтёт нужным, он проведёт
      полноценное клиническое интервью — именно оно, а не опросники,
      является основой диагноза.
  doctor_report:
    lead_in: "Сводный отчёт для специалиста — можно переслать или показать с экрана:"
    template: |-
      СВОДНЫЙ ОТЧЁТ СКРИНИНГА НА СДВГ (самоотчёт, телеграм-бот)
      Дата прохождения: {date}

      Скрининговые шкалы (каждая — отдельно, со своим порогом):
      1. ASRS v1.1, часть A (ВОЗ; официальная русская версия):
         {asrs_a_score}/6 значимых ответов; порог скрининга ≥4. Результат: {asrs_a_verdict}.
      2. ASRS v1.1, часть B (перевод вопросов НЕофициальный): {asrs_b_score}/12 значимых ответов (формального порога нет).
      3. WURS-25 (ретроспектива детства; перевод НЕофициальный):
         {wurs_score}/100; часто используемый порог ≥46. Результат: {wurs_verdict}.

      Контекст по критериям DSM-5 (нестандартизированные вопросы авторов бота):
      — Начало трудностей: {onset_fact}.
      — Сферы с заметными нарушениями сейчас: {adult_domains}.
      — Сферы с трудностями в возрасте 5–12 лет: {child_domains}.

      Оговорки: инструменты скрининговые, диагноз не устанавливают.
      Дифференциальная диагностика (критерий E DSM-5) не проводилась.
      Ответы даны самим респондентом без участия клинициста.

# ─────────────────────────────────────────────────────────────────────────────
# 6. Служебные тексты бота: границы блоков, пауза, прогресс, отмена, удаление.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  mode_button: "Самопроверка СДВГ"
  progress: "Вопрос {current} из {total}"
  continue_button: "Продолжить"
  pause_button: "Сделать паузу"
  paused: >-
    Пауза. Вернуться можно командой /adhd — продолжим ровно с этого места.
  resumed: "С возвращением! Продолжаем с того места, где остановились."
  block_boundaries:
    after_asrs_a: >-
      Первый блок готов — это был основной скрининг ВОЗ. Дальше часть B
      той же шкалы: 12 вопросов, минуты четыре. Продолжим?
    after_asrs_b: >-
      Шкала ASRS пройдена целиком. Следующий блок — 25 вопросов о том,
      каким ты был(а) в детстве (WURS-25), минут семь. Продолжим?
    after_wurs: >-
      Остался последний короткий блок: когда начались трудности и каким
      сферам жизни они мешают. Минуты три — и покажу результат.
  abandon_confirmed: >-
    Тест прерван, ответы этой сессии удалены. Захочешь пройти заново —
    команда /adhd.
  abandon_no_active: "Сейчас нет начатого теста."
  delete_confirm_prompt: >-
    Удалить все сохранённые результаты самопроверки СДВГ? Это действие
    необратимо.
  delete_confirm_button: "Да, удалить"
  delete_cancel_button: "Оставить"
  delete_done: "Готово: все результаты самопроверки СДВГ удалены."
  delete_nothing: "Сохранённых результатов нет — удалять нечего."
  fodmap_guard: >-
    У тебя сейчас идёт тест продукта в дневнике. Самопроверка СДВГ его
    не затронет — прогресс дневника сохранится. Начинаем?

# ─────────────────────────────────────────────────────────────────────────────
# 7. Трассируемость: наши вопросы → критерии DSM-5 (для docs репозитория).
# ─────────────────────────────────────────────────────────────────────────────
traceability:
  purpose: >-
    Показывает, какой элемент гибридного скрининга закрывает какой концепт
    критериев DSM-5. Дословный текст критериев не воспроизводится
    (копирайт APA) — критерии обозначены буквами и пересказаны кратко.
  rows:
    - ours: "ASRS v1.1, часть A (6 вопросов, официальный текст ВОЗ)"
      dsm: "Критерий A (частично)"
      note: >-
        Шесть пунктов, статистически отобранных ВОЗ из 18 симптомов DSM
        как лучший скрининговый предиктор; порог — ≥4 значимых ответа.
    - ours: "ASRS v1.1, часть B (12 вопросов, неофициальный перевод)"
      dsm: "Критерий A (остальные симптомы)"
      note: >-
        Вместе части A и B покрывают все 18 симптомов DSM (9 невнимательности
        A1a–A1i, 9 гиперактивности/импульсивности A2a–A2i). Формального
        порога у части B нет.
    - ours: "criterion_b.question — наш вопрос «было ли похожее до 12 лет» + возраст при «нет»"
      dsm: "Критерий B"
      note: "Концепт «несколько симптомов присутствовали до 12 лет», своя формулировка."
    - ours: "WURS-25 (ретроспектива детства, неофициальный перевод)"
      dsm: "Критерий B (поддерживающе)"
      note: >-
        Не прямое отображение критерия: шкала количественно подкрепляет
        самоотчёт о детском начале. В результатах балл идёт отдельной строкой
        со своим порогом и оговоркой о переводе.
    - ours: "domains, фаза «зрелость» — мультивыбор 5 сфер (work_study, relationships_family, social, leisure, self_esteem)"
      dsm: "Критерии C и D"
      note: >-
        Концепты «проявления в двух и более обстановках» (C) и «явное
        снижение качества функционирования» (D); ориентир интеграции —
        отмечено ≥2 сфер. Самооценка — сфера-индикатор дистресса,
        обстановкой в смысле C не считается.
    - ours: "domains, фаза «детство» — тот же мультивыбор про 5–12 лет"
      dsm: "Критерии C и D ретроспективно, поддержка критерия B"
      note: "Детские трудности по сферам укрепляют картину раннего начала."
    - ours: "—"
      dsm: "Критерий E"
      note: >-
        Ботом не проверяется (исключение других причин — задача врача);
        обязательная оговорка выводится в результатах (results.criterion_e_note).
