# Трек «Отношения с едой» (EDE-QS / BES / NIAS) — tgbase.
#
# Происхождение текста: ВЕСЬ текст этого файла написан с нуля авторами бота.
# Переводы самих инструментов (инструкции, пункты, шкалы) живут в
# edeqs_ru.yaml / bes_ru.yaml / nias_ru.yaml и сюда не входят.
#
# Стиль пользовательских текстов: коротко и по делу, без методологических
# оговорок (канон репозитория). Пользователь видит только короткий
# дисклеймер «скрининг, а не диагноз» и одну компактную строку атрибуции
# в подвале каждого результата.
#
# Согласие — одно на весь трек (спрашивается один раз, покрывает все три
# инструмента); каждый инструмент даёт свой результат со своим баллом —
# никаких сводных индексов.
#
# ЗАПРЕТЫ трека (закреплены каноническим тестом
# TestCanonical_EatingUserTextsHaveNoWeightNumbersOrDiagnoses):
#   * ноль цифр веса, роста, калорийности и никакого ИМТ в текстах;
#   * никаких названий расстройств в чате — ни в кнопках, ни в результатах,
#     ни в отчёте для врача (там допустимо «скрин по шкале X положительный»);
#   * никаких оговорок про неофициальность переводов.
#
# Подстановки — в синтаксисе i18n-бандлов репозитория: {имя_плейсхолдера}.

meta:
  module: "eating"
  version: 1
  language: "ru"
  title: "Отношения с едой"
  # Единственная оговорка, которую видит пользователь (согласие и подвалы
  # результатов). Держать короткой.
  disclaimer: >-
    Это скрининг, а не диагноз: диагноз ставит только специалист на очной
    консультации. Результат — повод обсудить тему с врачом.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Мини-меню трека: три инструмента + контекстные «Продолжить…».
# ─────────────────────────────────────────────────────────────────────────────
menu:
  prompt: >-
    Что проверим? Основной тест — 12 вопросов про последние 7 дней;
    переедание и избирательность — по паре минут.
  edeqs_button: "📋 Основной тест"
  bes_button: "🍩 Переедание"
  nias_button: "🥄 Избирательность в еде"
  resume_edeqs_button: "▶️ Продолжить: основной тест"
  resume_bes_button: "▶️ Продолжить: переедание"
  resume_nias_button: "▶️ Продолжить: избирательность"

# ─────────────────────────────────────────────────────────────────────────────
# 2. Согласие: одно на трек. Что это и что сохраняется.
# ─────────────────────────────────────────────────────────────────────────────
consent:
  title: "Пара слов перед стартом"
  body: >-
    Здесь три короткие самопроверки про еду: основной тест (12 вопросов
    о последних 7 днях), переедание (16 групп утверждений) и избирательность
    в еде (9 утверждений).


    Ответы касаются здоровья, поэтому про данные скажу прямо: сохраню только
    итоговые баллы, градации и даты прохождения. Ответы на отдельные вопросы
    после подсчёта не хранятся, никому третьему данные не передаются. Команда
    /food_delete в любой момент стирает всё сохранённое.
  agree_button: "Понятно, дальше"
  later_button: "Не сейчас"
  declined: >-
    Хорошо, ничего не записываю. Самопроверки можно запустить позже командой
    /food — остальные функции бота работают как обычно.

# ─────────────────────────────────────────────────────────────────────────────
# 3. EDE-QS — основной тест: заголовок блока и результат.
# ─────────────────────────────────────────────────────────────────────────────
edeqs:
  title: "Основной тест (EDE-QS)"
  results:
    score_line: "EDE-QS: {score} из 36 (порог ≥{cutoff})."
    bands:
      below: "Ниже порога скрининга."
      at_or_above: "Выше порога — есть смысл обсудить это с врачом."
    attribution_line: "EDE-QS — Gideon et al., 2016"

# ─────────────────────────────────────────────────────────────────────────────
# 4. BES — переедание: заголовок блока, подсказка по выбору, результат.
# ─────────────────────────────────────────────────────────────────────────────
bes:
  title: "Переедание (BES)"
  progress: "Группа {current} из {total}"
  pick_hint: "Отправь номер варианта."
  results:
    score_line: "BES: {score} из 46."
    bands:
      low: "Проявлений немного."
      moderate: "Умеренные проявления — есть смысл обсудить с врачом."
      severe: "Выраженные проявления — рекомендуем обратиться к специалисту."
    attribution_line: "BES — Gormally et al., 1982"

# ─────────────────────────────────────────────────────────────────────────────
# 5. NIAS — избирательность: заголовок, прогресс, результат по трём
#    субшкалам и строка контекста (ветку выбирает код, см. NiasContext).
# ─────────────────────────────────────────────────────────────────────────────
nias:
  title: "Избирательность в еде (NIAS)"
  progress: "Утверждение {current} из {total}"
  subscales:
    picky: "Избирательность"
    appetite: "Аппетит"
    fear: "Опасения по поводу еды"
  results:
    subscale_line: "{name}: {score} из 15 (порог ≥{cutoff}) — {verdict}"
    verdict_above: "выше порога"
    verdict_below: "в пределах порога"
    contexts:
      restrictive_no_body_image: >-
        Похоже на ограничительный паттерн питания без озабоченности образом
        тела. Это стоит показать врачу — такие ограничения разбирают отдельно.
      restrictive_body_image: >-
        Ограничения в еде, скорее всего, связаны с образом тела: основной
        тест тоже выше порога. Об этом стоит поговорить со специалистом.
      restrictive_unknown: >-
        Есть признаки ограничительного питания. Чтобы картина была полной,
        пройди основной тест — он занимает пару минут.
    attribution_line: "NIAS — Zickgraf & Ellis, 2018"

# ─────────────────────────────────────────────────────────────────────────────
# 6. Сводный отчёт для врача: всё пройденное с датами + строка контекста
#    про low-FODMAP (добавляется автоматически, если у пользователя есть
#    активность в дневнике). Рендерится на лету, никогда не хранится.
# ─────────────────────────────────────────────────────────────────────────────
doctor_report:
  lead_in: "Сводный отчёт для специалиста — можно переслать или показать с экрана:"
  heading: "СВОДНЫЙ ОТЧЁТ САМОПРОВЕРОК ПО ЕДЕ (самоотчёт, телеграм-бот)"
  edeqs_line: "EDE-QS ({date}): {score}/36, порог ≥{cutoff} — скрин {verdict}"
  verdict_positive: "положительный"
  verdict_negative: "отрицательный"
  bes_line: "BES ({date}): {score}/46 — {band}"
  nias_line: "NIAS ({date}): избирательность {picky}/15 (порог ≥{picky_cutoff}), аппетит {appetite}/15 (порог ≥{appetite_cutoff}), опасения {fear}/15 (порог ≥{fear_cutoff})"
  nias_contexts:
    restrictive_no_body_image: >-
      Субшкала выше порога при EDE-QS ниже порога — ограничительный паттерн
      без озабоченности образом тела.
    restrictive_body_image: >-
      Субшкала выше порога при EDE-QS на пороге или выше — ограничение,
      вероятно связанное с образом тела.
    restrictive_unknown: >-
      Субшкала выше порога; EDE-QS не пройден, поэтому разделить
      ограничительный паттерн и озабоченность образом тела нельзя.
  # Строка добавляется автоматически, только если у пользователя есть
  # активность в FODMAP-дневнике: врачу важно знать, что часть ограничений
  # в питании назначена по медицинским показаниям.
  fodmap_context_line: >-
    Контекст: пользователь ведёт элиминационную диету low-FODMAP по поводу
    СРК — ограничения в питании медицински мотивированы.
  footer: "Это скрининг, а не диагноз. EDE-QS — Gideon et al., 2016; BES — Gormally et al., 1982; NIAS — Zickgraf & Ellis, 2018."

# ─────────────────────────────────────────────────────────────────────────────
# 7. Служебные тексты бота: заголовок результата, прогресс, отмена, удаление.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  mode_button: "Отношения с едой"
  results_heading: "Твой результат"
  progress: "Вопрос {current} из {total}"
  abandon_confirmed: >-
    Тест прерван, ответы этой сессии удалены. Вернуться к самопроверкам —
    команда /food.
  delete_confirm_prompt: >-
    Удалить все сохранённые результаты самопроверок по еде (основной тест,
    переедание, избирательность)? Это действие необратимо.
  delete_confirm_button: "Да, удалить"
  delete_cancel_button: "Оставить"
  delete_done: "Готово: все результаты самопроверок по еде удалены."
  delete_nothing: "Сохранённых результатов нет — удалять нечего."
