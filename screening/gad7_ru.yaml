# GAD-7 — Generalized Anxiety Disorder-7, официальная русская версия
# («Russian for Russia») — tgbase, тест тревоги модуля настроения.
#
# Текст инструкции, всех 7 пунктов и шкалы ответов перенесён ДОСЛОВНО из
# официального PDF с phqscreeners.com (текст не менять). Ремарка бумажной
# анкеты «(Ставьте “✔”, чтобы указать свой ответ)» в боте опускается — тот
# же приём, что в phq9_ru.yaml.
#
# Правовой статус: как и PHQ-9, GAD-7 разработан на образовательный грант
# Pfizer; в подвале официального PDF — «Воспроизведение, перевод, показ и
# распространение разрешены» (no permission required).

instrument:
  id: gad7
  name_en: "Generalized Anxiety Disorder-7 (GAD-7)"
  name_ru_official: "GAD-7"
  developers: >-
    Robert L. Spitzer, Janet B.W. Williams, Kurt Kroenke и коллеги,
    в рамках образовательного гранта Pfizer Inc.
  primary_reference: >-
    Spitzer RL, Kroenke K, Williams JB, Löwe B. A brief measure for
    assessing generalized anxiety disorder: the GAD-7. Arch Intern Med.
    2006;166(10):1092-1097.
  sources:
    official_russian:
      url: "https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/GAD7_Russian%20for%20Russia.pdf"
      wayback: "https://web.archive.org/web/20260524090603/https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/GAD7_Russian%20for%20Russia.pdf"
      md5: "2c3daeb427221f6cb0bf746391390cbc"
      note: >-
        Живая копия (загружена 2026-08-25) и вэйбек-снимок 2026-05-24
        байт-в-байт идентичны (md5 совпадает) — текст стабилен.
  target_population: "Взрослые"
  recall_period: "Последние 14 дней"

# Инструкция — дословно из официального PDF (без бумажной ремарки).
instruction_official_ru: >-
  Как часто Вас за последние 14 дней беспокоили следующие проблемы?

# Шкала ответов — 4 градации, подписи дословно из официального PDF
# (совпадают с русской шкалой PHQ-9 той же семьи инструментов).
scale:
  - score: 0
    label: "Ни разу"
  - score: 1
    label: "Несколько дней"
  - score: 2
    label: "Более недели"
  - score: 3
    label: "Почти каждый день"

# 7 пунктов — text дословно из официального PDF (не редактировать).
items:
  - id: 1
    text: "Вы нервничали, тревожились или испытывали сильный стресс"
  - id: 2
    text: "Вы были неспособны успокоиться или контролировать свое волнение"
  - id: 3
    text: "Вы слишком сильно волновались по различным поводам"
  - id: 4
    text: "Вам было трудно расслабиться"
  - id: 5
    text: "Вы были настолько суетливы, что Вам было тяжело усидеть на месте"
  - id: 6
    text: "Вы легко злились или раздражались"
  - id: 7
    text: "Вы испытывали страх, словно должно произойти нечто ужасное"

scoring:
  method: >-
    Сумма баллов семи пунктов, диапазон 0–21. Градации выраженности — по
    Spitzer, Kroenke, Williams, Löwe (2006).
  bands:
    - { min: 0, max: 4, id: minimal }
    - { min: 5, max: 9, id: mild }
    - { min: 10, max: 14, id: moderate }
    - { min: 15, max: 21, id: severe }

# Подвал официального PDF, дословно:
attribution_text_ru: >-
  Разработано докторами Робертом Л. Шпицем (Robert L. Spitzer), Джанет Б.У.
  Уилльямс (Janet B.W. Williams), Куртом Кронке (Kurt Kroenke) и их коллегами
  в рамках образовательного гранта компании Pfizer Inc. Воспроизведение,
  перевод, показ и распространение разрешены.
