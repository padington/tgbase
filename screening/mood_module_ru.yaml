# Модуль настроения (WHO-5 / PHQ-9 / GAD-7) — tgbase, v2.
#
# Происхождение текста: ВЕСЬ текст этого файла написан с нуля авторами бота.
# Дословные тексты самих опросников (инструкции, пункты, шкалы, атрибуции)
# живут в phq9_ru.yaml / who5_ru.yaml / gad7_ru.yaml и сюда не входят.
#
# Стиль пользовательских текстов: коротко и по делу, без методологических
# оговорок (канон репозитория, пин TestCanonical_NoMethodologyCaveatsInUserTexts).
# Пользователь видит только короткий дисклеймер «скрининг, а не диагноз» и
# одну компактную строку атрибуции в подвале каждого результата.
#
# Согласие — одно на весь модуль (спрашивается один раз, покрывает все три
# инструмента); каждый инструмент даёт свой результат со своим баллом —
# никаких сводных индексов. Связки: WHO-5 ≤ 50 предлагает пройти PHQ-9,
# результат PHQ-9 предлагает GAD-7 — по одной кнопке, без клинических
# терминов.
#
# Кризисный протокол детерминирован и живёт в коде; он есть ТОЛЬКО в PHQ-9
# (вопрос 9) — в WHO-5 и GAD-7 кризисных пунктов нет. Здесь — только тексты.
# ВАЖНО: в контактах НЕ использовать 8-800-2000-122 (это детская линия) —
# запрет закреплён валидатором и каноническим тестом.
#
# Подстановки — в синтаксисе i18n-бандлов репозитория: {имя_плейсхолдера}.

meta:
  module: "mood"
  version: 2
  language: "ru"
  title: "Настроение"
  # Единственная оговорка, которую видит пользователь (согласие и подвалы
  # результатов). Держать короткой.
  disclaimer: >-
    Это скрининг, а не диагноз: диагноз ставит только специалист на очной
    консультации. Результат — повод обсудить тему с врачом.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Мини-меню модуля: три инструмента + контекстные «Продолжить…».
# ─────────────────────────────────────────────────────────────────────────────
menu:
  prompt: >-
    Что проверим? Быстрый чек — 5 коротких утверждений за минуту; настроение
    (PHQ-9) и тревога (GAD-7) — по паре минут.
  who5_button: "⚡ Быстрый чек (1 мин)"
  phq9_button: "📋 Настроение (PHQ-9)"
  gad7_button: "😰 Тревога (GAD-7)"
  resume_phq9_button: "▶️ Продолжить: настроение (PHQ-9)"
  resume_who5_button: "▶️ Продолжить: быстрый чек"
  resume_gad7_button: "▶️ Продолжить: тревога (GAD-7)"

# ─────────────────────────────────────────────────────────────────────────────
# 2. Согласие: одно на модуль. Что это и что сохраняется.
# ─────────────────────────────────────────────────────────────────────────────
consent:
  title: "Пара слов перед стартом"
  body: >-
    Здесь три короткие самопроверки о последних двух неделях: быстрый чек
    самочувствия (WHO-5, минута), настроение (PHQ-9) и тревога (GAD-7) — по
    паре минут каждая.


    Ответы касаются здоровья, поэтому про данные скажу прямо: сохраню только
    итоговые баллы, даты прохождения и отметку по вопросу о мыслях о смерти
    или самоповреждении. Ответы на отдельные вопросы после подсчёта не
    хранятся, никому третьему данные не передаются. Команда /mood_delete
    в любой момент стирает всё сохранённое.
  agree_button: "Понятно, дальше"
  later_button: "Не сейчас"
  declined: >-
    Хорошо, ничего не записываю. Самопроверки можно запустить позже командой
    /mood — остальные функции бота работают как обычно.

# ─────────────────────────────────────────────────────────────────────────────
# 3. Кризисная карточка (только PHQ-9): показывается СРАЗУ после ответа > 0
#    на вопрос 9. Тон тёплый, без нравоучений. Тест не блокируется — под
#    карточкой кнопка «Продолжить». При ответе 2–3 добавляется urgent_line.
# ─────────────────────────────────────────────────────────────────────────────
crisis:
  lead: >-
    Похоже, тебе сейчас непросто. С такими мыслями не обязательно оставаться
    один на один — вот куда можно обратиться прямо сейчас:
  contacts: |-
    📞 +7 495 989-50-50 — экстренная психологическая помощь МЧС (круглосуточно, вся Россия)
    📞 051 с городского, +7 495 051 с мобильного — Москва
    📞 8-800-250-18-59 — горячая линия Красного Креста (07:00–22:00 мск, есть чат в Telegram)
    🚨 112 — если есть угроза жизни
    Не в России? findahelpline.com
  urgent_line: >-
    Пожалуйста, поговори с кем-то живым сегодня — с близким человеком или по
    одному из этих номеров.
  continue_button: "Продолжить"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Результат PHQ-9: балл, градация (без диагнозов-ярлыков), динамика,
#    ретест, контакты (если в.9 > 0), дисклеймер + атрибуция одной строкой.
# ─────────────────────────────────────────────────────────────────────────────
results:
  heading: "Твой результат"
  score_line: "PHQ-9: {score} из 27."
  bands:
    minimal: "Симптомов минимально."
    mild: "Лёгкие проявления."
    moderate: "Умеренные проявления — есть смысл обсудить с врачом."
    moderately_severe: "Выраженные проявления — рекомендуем обратиться к специалисту."
    severe: "Сильные проявления — пожалуйста, обратись к врачу в ближайшее время."
  delta_line: "В прошлый раз ({ago}) было {prev}, сейчас {cur}."
  ago_today: "сегодня"
  ago_days: "{n} дн. назад"
  ago_weeks: "{n} нед. назад"
  retest_line: "Имеет смысл повторить тест через 2–4 недели — динамика важнее разового замера."
  crisis_heading: "Контакты поддержки — пусть будут под рукой:"
  attribution_line: "PHQ-9 — Spitzer, Williams, Kroenke"

# ─────────────────────────────────────────────────────────────────────────────
# 5. WHO-5: заголовок блока, прогресс, результат, предложение PHQ-9 при
#    сниженном самочувствии (body_very_low — настойчивее, для ≤ 28).
# ─────────────────────────────────────────────────────────────────────────────
who5:
  title: "Быстрый чек самочувствия (WHO-5)"
  progress: "Утверждение {current} из {total}"
  results:
    score_line: "WHO-5: {score} из 100."
    bands:
      ok: "Самочувствие в норме."
      low: "Самочувствие снижено."
      very_low: "Выраженное снижение самочувствия."
    attribution_line: "WHO-5 — © Всемирная организация здравоохранения"
  offer:
    body_low: >-
      Такой результат — повод присмотреться к настроению. Есть смысл пройти
      полный тест настроения (PHQ-9): 9 вопросов, пара минут.
    body_very_low: >-
      Такой результат — серьёзный повод проверить настроение подробнее.
      Пожалуйста, пройди полный тест настроения (PHQ-9): 9 вопросов, пара
      минут.
    start_button: "📋 Пройти тест настроения"
    later_button: "Не сейчас"

# ─────────────────────────────────────────────────────────────────────────────
# 6. GAD-7: заголовок блока, результат (градации без ярлыков), предложение
#    GAD-7 после результата PHQ-9 («часто идут вместе»).
# ─────────────────────────────────────────────────────────────────────────────
gad7:
  title: "Тест тревоги (GAD-7)"
  results:
    score_line: "GAD-7: {score} из 21."
    bands:
      minimal: "Проявлений минимально."
      mild: "Лёгкие проявления."
      moderate: "Умеренные проявления — есть смысл обсудить с врачом."
      severe: "Выраженные проявления — рекомендуем обратиться к специалисту."
    attribution_line: "GAD-7 — Spitzer, Williams, Kroenke"
  offer:
    body: >-
      Настроение и тревога часто идут вместе. Можно сразу пройти короткий
      тест тревоги (GAD-7): 7 вопросов, минута-другая.
    start_button: "😰 Пройти тест тревоги"
    later_button: "Не сейчас"

# ─────────────────────────────────────────────────────────────────────────────
# 7. Сводный отчёт для врача: объединяет всё пройденное (PHQ-9 + 10-й вопрос
#    + GAD-7 + WHO-5) с датами. Рендерится на лету, никогда не хранится.
# ─────────────────────────────────────────────────────────────────────────────
doctor_report:
  lead_in: "Сводный отчёт для специалиста — можно переслать или показать с экрана:"
  heading: "СВОДНЫЙ ОТЧЁТ САМОПРОВЕРОК НАСТРОЕНИЯ (самоотчёт, телеграм-бот)"
  phq9_line: "PHQ-9 ({date}): {score}/27 — {band}"
  q9_line: "Пункт 9 (мысли о смерти / самоповреждении): {q9_fact}"
  q9_marked: "отмечен"
  q9_not_marked: "не отмечен"
  q10_line: "Влияние на работу, домашние дела, общение: {answer}"
  gad7_line: "GAD-7 ({date}): {score}/21 — {band}"
  who5_line: "WHO-5 ({date}): {score}/100 — {band}"
  footer: "Это скрининг, а не диагноз. PHQ-9, GAD-7 — Spitzer, Williams, Kroenke и коллеги; WHO-5 — © ВОЗ."

# ─────────────────────────────────────────────────────────────────────────────
# 8. Служебные тексты бота: прогресс, отмена, удаление, кнопка режима.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  mode_button: "Самопроверка настроения"
  progress: "Вопрос {current} из {total}"
  abandon_confirmed: >-
    Тест прерван, ответы этой сессии удалены. Вернуться к самопроверкам —
    команда /mood.
  delete_confirm_prompt: >-
    Удалить все сохранённые результаты самопроверок настроения (WHO-5,
    PHQ-9, GAD-7)? Это действие необратимо.
  delete_confirm_button: "Да, удалить"
  delete_cancel_button: "Оставить"
  delete_done: "Готово: все результаты самопроверок настроения удалены."
  delete_nothing: "Сохранённых результатов нет — удалять нечего."
