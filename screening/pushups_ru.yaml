# Трек «Отжимания» — tgbase.
#
# ПРОИСХОЖДЕНИЕ (важно, читать перед правкой).
# Весь текст этого файла написан с нуля авторами бота. Схема трека —
# собственная реализация общеизвестного паттерна: «тест на максимум →
# индивидуальная нагрузка от результата → несколько подходов с открытым
# последним → перетест». Сам по себе такой метод тренировки не охраняется
# как объект авторского права (17 USC §102(b); ГК РФ ст. 1259 п. 5), а вот
# конкретные таблицы подходов из коммерческих программ — охраняются.
# Поэтому здесь НЕТ НИ ОДНОЙ ЗАИМСТВОВАННОЙ ТАБЛИЦЫ: все числа подходов
# ПОРОЖДАЮТСЯ ФОРМУЛОЙ от результата теста по параметрам блока `params`
# этого файла. Ни бренда, ни названий, ни текстов коммерческих
# первоисточников в репозитории нет — закреплено каноническим тестом
# TestCanonical_PushupContentHasNoSourceBranding.
#
# ЧТО ЭТО ЗНАЧИТ НА ПРАКТИКЕ. Единственная переменная программы — «база» B
# (последний результат теста). Всё остальное — функции от неё: число
# подходов, рабочее число W, пол открытого подхода F, отдых, шаг недельной
# прогрессии. Правь `params` — меняется вся программа, логика не трогается.
#
# ЗАПРЕТЫ трека (закреплены каноническими тестами):
#   * ноль чисел веса, роста, калорийности, никакого ИМТ в текстах — в боте
#     живёт трек скрининга отношений с едой с таким же пином, и нарушать
#     его в соседнем треке нельзя. Лестница вариантов описывается словами
#     «легче/тяжелее». (Порядок лестницы обоснован тем, какая доля массы
#     тела приходится на руки в каждом варианте, но это обоснование живёт
#     здесь, в комментарии, и никогда — в сообщении пользователю.)
#   * никаких обещаний вида «столько-то повторов за столько-то недель» и
#     никаких упоминаний коммерческих программ-первоисточников;
#   * никаких методологических оговорок и ссылок на исследования в текстах:
#     обоснования — только в комментариях этого файла.
#
# БЕЗОПАСНОСТЬ. Потолок объёма (`volume_cap_early` / `volume_cap`) — защита
# от перегрузки у детренированного человека, он применяется в коде и
# пользователю не показывается. Гейт на входе — три вопроса по духу
# опросников готовности к нагрузке: профилирование факторов риска не
# добавляем, это барьер, а не польза.
#
# Подстановки — в синтаксисе i18n-бандлов репозитория: {имя_плейсхолдера}.

meta:
  module: "pushups"
  version: 1
  language: "ru"
  title: "Отжимания"
  # Единственная оговорка, которую видит пользователь. Держать короткой.
  disclaimer: >-
    Это тренировки, а не медицина. Больно или плохо — останавливайся и иди
    к врачу.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Согласие: одно на весь трек, спрашивается один раз.
# ─────────────────────────────────────────────────────────────────────────────
consent:
  title: "Отжимания"
  body: >-
    Три тренировки в неделю, примерно по {minutes} минут. Сначала тест на
    максимум — по нему подберу твои числа. Дальше подходы с открытым
    последним, отдых считаю я, раз в месяц перетест. Цель — удвоить свой
    сегодняшний максимум. Сохраняю только числа подходов и даты.
  agree_button: "Начинаю"
  later_button: "Не сейчас"
  declined: "Хорошо, трек подождёт. Открыть — /pushups."

# ─────────────────────────────────────────────────────────────────────────────
# 2. Гейт безопасности: ровно три да/нет, по одному сообщению.
#    on_yes: stop — трек не стартует; easier — старт на две ступени легче;
#    doctor_note — строка «согласуй с врачом» + лёгкий вариант.
# ─────────────────────────────────────────────────────────────────────────────
gate:
  yes_button: "Да"
  no_button: "Нет"
  questions:
    - id: "health"
      text: >-
        Есть болезнь сердца, обмена веществ или почек — или при нагрузке
        бывает боль в груди, дурнота, сильная одышка?
      on_yes: "stop"
    - id: "joint_pain"
      text: "Сейчас болит плечо, локоть или запястье?"
      on_yes: "easier"
    - id: "pregnancy"
      text: "Беременность?"
      on_yes: "doctor_note"
  stop_screen: >-
    Тогда сначала к врачу: с этим нагрузку подбирают очно. Трек не запускаю.
  easier_note: >-
    Начнём полегче. Боль — сигнал остановиться, а не потерпеть: если больно
    в подходе, заканчивай подход.
  doctor_note: >-
    Согласуй нагрузку с врачом. Пока ставлю лёгкий вариант.

# ─────────────────────────────────────────────────────────────────────────────
# 3. Цель. Ветвит логику плато на всю жизнь трека, поэтому спрашивается один
#    раз и до теста.
# ─────────────────────────────────────────────────────────────────────────────
goal:
  prompt: "Что важнее?"
  reps_button: "Больше повторов"
  strength_button: "Сила и форма"
  reps_note: "Растим объём: больше подходов, короче отдых."
  strength_note: "Со временем предложу вариант потяжелее."

# ─────────────────────────────────────────────────────────────────────────────
# 4. Лестница вариантов, от лёгкого к тяжёлому. `offered: true` — то, что
#    показываем на выбор в v1; остальные ступени существуют, чтобы шаг вниз
#    (боль, три повтора недели) и шаг вверх были плавными.
# ─────────────────────────────────────────────────────────────────────────────
variations:
  prompt: "С чего начинаем?"
  hint: "Бери тот, где ровной техникой делаешь 5–15 повторов."
  default_id: "knees"
  ladder:
    - id: "wall"
      name: "От стены"
      hint: "Стоя, руки в стену."
      offered: true
    - id: "high_bench"
      name: "От высокой опоры"
      hint: "Руки на столе или подоконнике."
      offered: true
    - id: "low_bench"
      name: "От низкой опоры"
      hint: "Руки на скамье или ступеньке."
      offered: false
    - id: "knees"
      name: "С колен"
      hint: "Колени на полу, спина прямая."
      offered: true
    - id: "classic"
      name: "Классические"
      hint: "Упор лёжа, ноги на полу."
      offered: true
    - id: "narrow"
      name: "Узкая постановка"
      hint: "Ладони под грудью."
      offered: false
    - id: "pause"
      name: "С паузой внизу"
      hint: "Внизу задержка на счёт «раз-два»."
      offered: false
    - id: "feet_up"
      name: "Ноги на возвышении"
      hint: "Стопы на скамье."
      offered: false

# ─────────────────────────────────────────────────────────────────────────────
# 5. Тест и перетест: один протокол, один потолок (params.test_cap).
# ─────────────────────────────────────────────────────────────────────────────
test:
  intro: >-
    Тест: одна серия, столько повторов, сколько получится ровной техникой.
    Закончишь — пришли число.
  rep_rules:
    - "Плечи, таз и колени на одной линии."
    - "Вниз — до прямого угла в локте или почти касаясь грудью пола."
    - "Вверх — до полного выпрямления рук."
    - "Наверху не отдыхаем."
  stop_rules:
    - "Техника развалилась и не вернулась на следующем повторе — стоп."
    - "Головокружение, боль, сильная одышка — стоп."
  prompt: "Сколько получилось?"
  bad_input: "Пришли число повторов, например 12."
  result_line: "{reps}. База {base}, уровень {level}."
  plan_line: "Первая тренировка: {sets} — примерно {minutes} минут."
  capped: "{reps} — это потолок теста. Предлагаю вариант потяжелее и перетест."
  too_low: "Возьмём вариант полегче и повторим тест — так числа будут честнее."
  floor_note: "Ставлю базу {base} и начинаем с самого лёгкого варианта."
  retest_intro: >-
    Раз в месяц сверяемся. Сегодня тест на максимум, он же засчитается за
    третью тренировку недели.
  compare_up: "Было {old}, стало {new}. База {base}."
  compare_same: "Столько же, сколько в прошлый раз — {new}. База {base}."
  compare_down: "Было {old}, стало {new}. Неделя будет полегче."

# ─────────────────────────────────────────────────────────────────────────────
# 6. Тренировка: один подход — одно сообщение. Отдых серверный.
# ─────────────────────────────────────────────────────────────────────────────
session:
  set_prompt: "Подход {current}/{total} — {reps} повторов. Сколько получилось?"
  open_prompt: >-
    Подход {current}/{total} — открытый. Минимум {floor}, дальше сколько
    сможешь ровной техникой. Останавливайся, когда техника начинает ломаться.
  recorded: "Записал {reps}. Отдых {rest} с."
  rest_over: "Поехали: подход {current}/{total} — {reps} повторов."
  ready_button: "Готов раньше"
  pause_button: "Пауза"
  start_button: "Начать тренировку"
  later_button: "Позже, напомни"
  bad_input: "Пришли число повторов, например 12."
  summary_over: "Готово: {total} повторов, открытый подход {open} — на {extra} больше цели."
  summary_plan: "Готово: {total} повторов, открытый подход {open} — ровно по плану."
  summary_short: "Готово: {total} повторов. Вышло не всё — тренировка засчитана."
  effort_prompt: "Как ощущалось?"
  effort_hard_button: "Тяжело"
  effort_ok_button: "Нормально"
  effort_easy_button: "Легко"
  effort_hard_reply: "Понял, следующая будет чуть легче."
  effort_ok_reply: "Понял, следующая будет такая же."
  effort_easy_reply: "Понял, следующая будет чуть плотнее."
  next_due: "Следующая тренировка через {hours} часов, напомню."
  rest_day: "Сегодня отдых. Рост происходит между тренировками."
  too_soon: "С прошлой тренировки прошло {hours} ч. Лучше подождать до {advised}."
  train_anyway_button: "Всё равно тренироваться"
  expired: "Прошлая тренировка осталась незаконченной — засчитал по факту."

# ─────────────────────────────────────────────────────────────────────────────
# 7. Закрытие недели. Повтор недели ВСЕГДА объявляется вслух — молчаливый
#    откат пользователи считают багом.
# ─────────────────────────────────────────────────────────────────────────────
week:
  closed_steady: "Неделя закрыта, база {old} → {new}."
  closed_strong: "Неделя закрыта с запасом, база {old} → {new}."
  closed_hold: "Неделя закрыта, база прежняя — {base}. Одна тренировка не в счёт."
  repeat: >-
    Повторяем неделю: в двух тренировках был недобор. Немного снизил цифры:
    база {old} → {new}.
  fork_prompt: "Третий повтор подряд. Давай что-нибудь поменяем."
  fork_easier_button: "Вариант полегче"
  fork_rest_button: "Больше отдыха"
  fork_easier_reply: "Беру вариант полегче и делаю короткий перетест."
  fork_rest_reply: "Добавил {seconds} с отдыха ко всем подходам."
  retest_due: "Следующая тренировка — перетест."

# ─────────────────────────────────────────────────────────────────────────────
# 8. Красная карточка: срабатывает по факту, а не по баллу.
# ─────────────────────────────────────────────────────────────────────────────
red_card:
  prompt: "Что-то из этого есть?"
  signs:
    - "Моча цвета колы."
    - "Боль, которая через двое суток только сильнее."
    - "Руки не разгибаются."
    - "Рука или плечо заметно отекли."
  yes_button: "Да, что-то есть"
  no_button: "Ничего такого"
  body: >-
    Это к врачу сегодня, тренировки прекращаем. Трек ставлю на паузу —
    вернёшься, когда разберётесь.
  joint_pain_prompt: "Болит плечо, локоть или запястье?"
  joint_pain_reply: >-
    Беру вариант полегче, база остаётся. Перетест сделаем, когда пройдёт.

# ─────────────────────────────────────────────────────────────────────────────
# 9. Меню трека, экран прогресса, строка отчёта, удаление, пинги.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  mode_button: "💪 Отжимания"
  menu_prompt: "Отжимания: неделя {week}, тренировка {session} из {total}."
  train_button: "Начать тренировку"
  resume_button: "▶️ Продолжить тренировку: подход {current}/{total}"
  progress_button: "📈 Прогресс"
  retest_button: "Перетест"
  progress_base: "База {base}, уровень {level}, {variation}."
  progress_week: "Неделя {week}, тренировка {session} из {total}."
  progress_test: "Последний тест {date} — {reps}."
  progress_open: "Открытые подходы: {sparkline}"
  progress_volume: "Всего повторов: {total}."
  progress_streak: "Недель подряд: {weeks}."
  report_line: >-
    💪 Отжимания: база {base} (уровень {level}), {variation}. Тест {date} —
    {reps}. Тренировок {sessions}, всего {volume} повторов.
  abandon_confirmed: "Тренировку бросил. Программа осталась."
  delete_confirm_prompt: "Удалить трек «Отжимания» — программу, историю и тесты?"
  delete_confirm_button: "Удалить"
  delete_cancel_button: "Оставить"
  delete_done: "Удалил."
  delete_nothing: "Нечего удалять."
  due_ping: "Пора тренироваться: {sets} подходов, {minutes} минут."
  overdue_ping: "Тренировка ждёт: {sets} подходов, {minutes} минут."

# ─────────────────────────────────────────────────────────────────────────────
# 10. ПАРАМЕТРЫ ГЕНЕРАТОРА. Здесь живут ВСЕ числа программы. Логика в
#     internal/screening/pushups.go читает только этот блок.
#
#     Генератор (одна сессия): k = day_factors[d] × поправка самооценки e
#     (× deload_factor на разгрузочной неделе);
#       W = max(min_set_reps, round(work_share × B × k));
#       F = max(W + open_gap, round(open_share × B × k));
#     число подходов n — по set_count_thresholds; форма недели — set_offsets
#     (смещения фиксированных подходов относительно W, последний подход —
#     открытый, с полом F).
#
#     Потолок объёма срезает предпоследний фиксированный подход, пока сумма
#     не влезет в потолок или пока подходов не останется min(set_counts).
#     ВАЖНО: срез считается по НЕЙТРАЛЬНОЙ сессии (k = 1), то есть число
#     подходов зависит только от базы и режима потолка, а k масштабирует
#     числа внутри уже выбранной формы. Иначе потолок режет тяжёлый день и не
#     трогает лёгкий: при базе 25 в первые шесть сессий неделя выходила
#     56 / 63 / 52 повтора — «тяжёлый» день самый лёгкий; та же ступенька под
#     самооценкой делала следующую сессию после «легко» легче, а не плотнее.
#     Поэтому потолок ограничивает сессию средней интенсивности; тяжёлый день
#     при максимальной самооценке выше него на свой множитель
#     (day_factors[-1] × effort_adj.max ≈ 1.32) — это форма недели, а не обход
#     ограничения.
# ─────────────────────────────────────────────────────────────────────────────
params:
  # База и тест.
  min_base: 3            # ниже не опускаемся ни при каких исходах
  too_low_reps: 2        # тест ≤ этого — ступень вниз и немедленный перетест
  test_cap: 60           # потолок теста: выше — предлагаем вариант потяжелее
  max_reps_input: 200    # свободный ввод вне 0..этого — переспрос
  small_base_max: 6      # «малая база»: свои клампы, иначе подходы вырождаются

  # Форма сессии.
  day_factors: [0.85, 1.00, 1.15]   # лёгкий / средний / тяжёлый день недели
  work_share: 0.40                  # доля базы на рабочий подход W
  open_share: 0.55                  # доля базы на пол открытого подхода F
  small_base_open_share: 0.60       # при B ≤ small_base_max
  set_count_thresholds: [7, 25, 45] # границы базы для числа подходов
  set_counts: [4, 5, 6, 7]          # число подходов по этим границам
  set_offsets:                      # смещения фиксированных подходов от W
    4: [0, 1, 0]
    5: [0, 1, -1, -1]
    6: [0, 1, 0, -1, -1]
    7: [0, 1, 0, 0, -1, -1]
  min_set_reps: 2                   # ни один фиксированный подход не ниже
  small_base_min_set_reps: 1        # при B ≤ small_base_max
  open_gap: 2                       # F не ближе к W, чем на столько
  small_base_open_gap: 1            # при B ≤ small_base_max

  # Отдых. Диапазон выносливостный; превышение отдыха недобором не считается.
  rest_seconds: [60, 90, 120]
  rest_floor_seconds: 45   # ниже не опускаемся никогда
  rest_cut_seconds: 15     # цель «больше повторов» + база ≥ rest_cut_base
  rest_cut_base: 45
  rest_bonus_step: 30      # кнопка «+30 с ко всему», один раз на трек

  # Потолок объёма (защита от перегрузки; в текстах не появляется).
  volume_cap_early: 2.5    # первые early_sessions сессий: сумма ≤ 2.5 × B
  volume_cap: 3.5          # дальше: сумма ≤ 3.5 × B
  early_sessions: 6
  deload_factor: 0.85      # неделя разгрузки: все k × это
  retest_deload_share: 0.80 # перетест ниже 0.8 × прежней базы → разгрузка

  # Самооценка после сессии: три кнопки, накопительно, с клампом.
  effort_adj:
    hard: -0.10
    ok: 0.00
    easy: 0.10
    min: 0.85
    max: 1.15

  # Недельная прогрессия по результату (не по календарю).
  progression:
    over_margin: 2          # открытый подход ≥ F + это → «над планом»
    strong_over_count: 2    # столько «над планом» при нуле недоборов → сильный шаг
    repeat_short_count: 2   # столько недоборов → повтор недели
    strong_share: 0.08
    strong_min: 2
    steady_share: 0.04
    steady_min: 1
    drop_share: 0.08        # снижение базы при повторе недели
    drop_min: 1
    repeat_fork_after: 3    # три повтора подряд → развилка из двух кнопок

  # Календарь и хранение.
  sessions_per_week: 3
  retest_every_sessions: 12
  joint_pain_step_down: 2   # «болит» на входе → на столько ступеней легче
  min_hours_between: 24     # раньше — жёсткая блокировка
  advised_hours_between: 48 # рекомендация
  pause_retest_days: 10     # пауза дольше — внеочередной перетест
  pause_deload_days: 21     # пауза дольше — перетест + разгрузочная неделя
  session_ttl_hours: 24     # незакрытая сессия живёт столько, потом по факту
  history_cap: 36           # кольцо истории сессий (≈12 недель)
  level_step: 5             # уровень = 1 + база / это
  level_max: 20
  seconds_per_rep: 4        # только для оценки «примерно N минут»
