# WHO-5 — Индекс благополучия ВОЗ (The World Health Organization-Five
# Well-Being Index), официальная русская версия — tgbase, «быстрый чек»
# модуля настроения.
#
# Текст перенесён ДОСЛОВНО из официального PDF публикации ВОЗ
# WHO-UCN-MSD-MHE-2024.01 (русская вкладка страницы публикации на who.int).
# Русский перевод в публикации — «Индекс общего (хорошего) самочувствия/ВОЗ
# (вариант 1999 г.)», выполнен Psychiatric Research Unit, WHO Collaborating
# Centre in Mental Health (Hillerød); в 2024 году ВОЗ приняла копирайт WHO-5
# и публикует инструмент как open access (лицензия CC BY-NC-SA 3.0 IGO).
#
# Бумажные ремарки формы в боте опускаются — тот же приём, что с ремаркой
# «(Ставьте “✔”…)» PHQ-9: просьба «обведите одну из цифр…» и пример про
# «цифру 3 в верхнем правом углу квадратика» привязаны к бумажному бланку
# с цифровыми квадратиками. Двухнедельный период доносится дословным
# заголовком строки формы («Последние две недели»), показываемым над
# утверждениями. Полная инструкция бумажной формы для трассируемости:
# «Обведите одну из цифр против каждого из пяти нижеприведенных
# утверждений, ближе/лучше всего отражающую ваше самочувствие в последние
# две недели. Учтите, что более высокие баллы означают более хорошее
# самочувствие.»

instrument:
  id: who5
  name_en: "The World Health Organization-Five Well-Being Index (WHO-5)"
  name_ru_official: "Индекс общего (хорошего) самочувствия/ВОЗ (вариант 1999 г.)"
  developers: >-
    Per Bech, Psychiatric Centre North Zealand (WHO Collaborating Centre
    for Mental Health, Hillerød); копирайт передан ВОЗ в 2024 году.
  primary_reference: >-
    The World Health Organization-Five Well-Being Index (WHO-5). Geneva:
    World Health Organization; 2024 (WHO/UCN/MSD/MHE/2024.1).
    Licence: CC BY-NC-SA 3.0 IGO.
  sources:
    official_russian:
      publication: "WHO-UCN-MSD-MHE-2024.01"
      page: "https://www.who.int/ru/publications/m/item/WHO-UCN-MSD-MHE-2024.01"
      url: "https://cdn.who.int/media/docs/default-source/mental-health/who-5_russian.pdf?sfvrsn=ed43f352_11"
      wayback: "https://web.archive.org/web/20250405060736/https://cdn.who.int/media/docs/default-source/mental-health/who-5_russian.pdf"
      md5: "3421a893a4ffc476acbc438c0cf1bf5a"
      note: >-
        Живая копия (загружена 2026-08-25) и вэйбек-снимок 2025-04-05
        байт-в-байт идентичны (md5 совпадает) — текст стабилен.
  target_population: "Взрослые"
  recall_period: "Последние 2 недели"

# Заголовок строки бумажной формы — дословно; показывается один раз над
# утверждением 1 как обозначение периода.
recall_header_official_ru: "Последние две недели"

# Шкала — 6 градаций, подписи дословно из официального PDF. В форме колонки
# идут от лучшего к худшему (5 → 0) — порядок сохранён, кнопки рендерятся
# сверху вниз в том же порядке.
scale:
  - score: 5
    label: "Все время"
  - score: 4
    label: "Большую часть времени"
  - score: 3
    label: "Более половины времени"
  - score: 2
    label: "Менее половины времени"
  - score: 1
    label: "Некоторое время"
  - score: 0
    label: "Никогда"

# 5 утверждений — text дословно из официального PDF (не редактировать;
# пунктуация формы сохранена, включая отсутствие точки в утверждении 1).
items:
  - id: 1
    text: "Я чувствую себя бодрой(-ым) и в хорошем настроении"
  - id: 2
    text: "Я чувствую себя спокойной(-ым) и раскованной(-ым)."
  - id: 3
    text: "Я чувствую себя активной(-ым) и энергичной(-ым)."
  - id: 4
    text: "Я просыпаюсь и чувствую себя свежей(-им) и отдохнувшей(-им)."
  - id: 5
    text: "Каждый день со мной происходят вещи, представляющие для меня интерес."

# Скоринг — по официальной инструкции формы («сложите отмеченные вами
# цифры/числа … и умножьте полученную сумму на четыре»): сумма 0–25 × 4 →
# 0–100, более высокие баллы означают более хорошее самочувствие.
# Интерпретационные пороги (продуктовое решение бота поверх стандартного
# скринингового порога WHO-5 ≤ 50): > 50 — самочувствие в норме; ≤ 50 —
# самочувствие снижено; ≤ 28 — выраженное снижение.
scoring:
  multiplier: 4
  bands:
    - { min: 0, max: 28, id: very_low }
    - { min: 29, max: 50, id: low }
    - { min: 51, max: 100, id: ok }

# Подвал официального PDF, дословно:
attribution_text_ru: >-
  © Psychiatric Research Unit, WHO Collaborating Center for Mental Health,
  Frederiksborg General Hospital, DK-3400 Hillerød
